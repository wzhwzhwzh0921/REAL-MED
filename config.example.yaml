# REAL-MED model registry. Copy to config.yaml and fill in .env.
# Context capacities follow paper Appendix C, Table 7 for reproducibility.
# Override context_window explicitly when using a different model revision.
config_version: 3
llm_max_retries: 10

models:
- name: gpt-5.5
  display_name: gpt-5.5
  use: deerflow.models.openrouter:ChatOpenRouter
  model: openai/gpt-5.5
  api_key: $OPENROUTER_API_KEY
  base_url: $OPENROUTER_API_BASE
  context_window: 1050000
  supports_thinking: true
  supports_reasoning_effort: true
  supports_vision: true
  max_tokens: 32768
  when_thinking_enabled:
    extra_body:
      reasoning:
        enabled: true
        effort: high
