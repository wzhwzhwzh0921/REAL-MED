# Task type: soap_documentation
# Emergency department SOAP note: write a clinical record from a provided case + SOAP template attachment. Output PDF.

task_type: soap_documentation
description: "Emergency department SOAP note: write a clinical record from a provided case + SOAP template attachment. Output PDF."

# --- Runtime defaults ---
defaults:
  thinking: "on"
  reasoning_effort: "high"
  plan_mode: true
  subagent: true
  recursion_limit: 4000

# --- Skills ---
skills:
  - code
  - web-search
  - web-search-mm
  - pdf
  - docx
  - xlsx
  - pptx
  - pptx-design
  - nano-banana-pro
  - draw-io-diagram-generator

# --- Expected outputs ---
expected_outputs:
  - pattern: "*.pdf"
    required: true

# --- Judge profile ---
judge_profile: rubric_judge

extensions_config: task_types/extensions_configs/general.json
