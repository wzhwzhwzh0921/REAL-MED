# Task type: surgery_planning
# Surgical clinical reasoning: intraoperative + postoperative plan from a provided case, output as Word document.

task_type: surgery_planning
description: "Surgical clinical reasoning: intraoperative + postoperative plan from a provided case, output as Word document."

# --- Runtime defaults ---
defaults:
  thinking: "on"
  reasoning_effort: "high"
  plan_mode: true
  subagent: true
  recursion_limit: 4000

# --- Skills ---
skills:
  - code
  - web-search
  - web-search-mm
  - pdf
  - docx
  - xlsx
  - pptx
  - pptx-design
  - nano-banana-pro
  - draw-io-diagram-generator

# --- Expected outputs ---
expected_outputs:
  - pattern: "*.docx"
    required: true

# --- Judge profile ---
judge_profile: rubric_judge

extensions_config: task_types/extensions_configs/general.json
