# Task type: pharmacy_aware_medication_management
# Clinical pharmacist drug-management case: fill in a provided Word template; uses the attached patient + inventory xlsx.

task_type: pharmacy_aware_medication_management
description: "Clinical pharmacist drug-management case: fill in a provided Word template; uses the attached patient + inventory xlsx."

# --- Runtime defaults ---
defaults:
  thinking: "on"
  reasoning_effort: "high"
  plan_mode: true
  subagent: true
  recursion_limit: 4000

# --- Skills ---
skills:
  - code
  - web-search
  - web-search-mm
  - pdf
  - docx
  - xlsx
  - pptx
  - pptx-design
  - nano-banana-pro
  - draw-io-diagram-generator

# --- Expected outputs ---
expected_outputs:
  - pattern: "*.docx"
    required: true

# --- Judge profile ---
judge_profile: rubric_judge

extensions_config: task_types/extensions_configs/general.json
