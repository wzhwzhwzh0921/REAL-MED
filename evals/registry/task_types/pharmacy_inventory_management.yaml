task_type: pharmacy_inventory_management
description: "Inpatient pharmacy ward dispensing / prescription audit / procurement etc. Backed by the pharmacy-operations MCP (per-question inventory excels)."

# --- Runtime defaults ---
defaults:
  thinking: "on"
  reasoning_effort: "high"
  plan_mode: true
  subagent: true
  recursion_limit: 4000

# --- Skills ---
