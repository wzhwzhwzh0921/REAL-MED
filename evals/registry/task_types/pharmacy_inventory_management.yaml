extensions_config: task_types/extensions_configs/pharmacy_inventory_management.json

# --- Expected outputs ---
expected_outputs:
  - pattern: "*.docx"
    required: true
  - pattern: "*.xlsx"
    required: true

# --- Judge profile ---
judge_profile: junxiu_rubric_judge
