# Task type: dosage_calculation
# Pediatric / clinical dosage calculation. All numeric computations must go through the medcal MCP (`medcal_*` tools). Output is a Word document.

task_type: dosage_calculation
description: "Pediatric / clinical dosage calculation. All numeric computations must go through the medcal MCP (`medcal_*` tools). Output is a Word document."

# --- Runtime defaults ---
defaults:
  thinking: "on"
  reasoning_effort: "high"
  plan_mode: true
  subagent: true
  recursion_limit: 4000

# --- Skills ---
skills:
  - code
  - web-search
  - web-search-mm
  - pdf
  - docx
  - xlsx
  - pptx
  - pptx-design
  - nano-banana-pro
  - draw-io-diagram-generator

extensions_config: task_types/extensions_configs/dosage_calculation.json

# --- Expected outputs ---
expected_outputs:
  - pattern: "*.docx"
    required: true

# --- Judge profile ---
judge_profile: rubric_judge
