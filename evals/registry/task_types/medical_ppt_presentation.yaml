# Task type: medical_ppt_presentation
# Build a medical lecture PPT (the case-specific slide count and speaker notes) following an attached `.pptx` template's master/layout/colour system.

task_type: medical_ppt_presentation
description: "Build a medical lecture PPT (the case-specific slide count and speaker notes) following an attached `.pptx` template's master/layout/colour system."

# --- Runtime defaults ---
defaults:
  thinking: "on"
  reasoning_effort: "high"
  plan_mode: true
  subagent: true
  recursion_limit: 4000

# --- Skills ---
skills:
  - code
  - web-search
  - web-search-mm
  - pdf
  - docx
  - xlsx
  - pptx
  - pptx-design
  - nano-banana-pro
  - draw-io-diagram-generator

# --- Expected outputs ---
expected_outputs:
  - pattern: "*.pptx"
    required: true

# --- Judge profile ---
judge_profile: rubric_judge

extensions_config: task_types/extensions_configs/general.json
