# Task type: complex_case_review
# Complex inpatient case review: primary diagnosis + management orders, delivered as a single PDF.

task_type: complex_case_review
description: "Complex inpatient case review: primary diagnosis + management orders, delivered as a single PDF."

# --- Runtime defaults ---
defaults:
  thinking: "on"
  reasoning_effort: "high"
  plan_mode: true
  subagent: true
  recursion_limit: 4000

# --- Skills ---
skills:
  - code
  - web-search
  - web-search-mm
  - pdf
  - docx
  - xlsx
  - pptx
  - pptx-design
  - nano-banana-pro
  - draw-io-diagram-generator

# --- Expected outputs ---
expected_outputs:
  - pattern: "*.pdf"
    required: true

# --- Judge profile ---
judge_profile: rubric_judge

extensions_config: task_types/extensions_configs/general.json
