# Judge profile: junxiu_rubric_judge_vision
# 视觉评分点（rubrics_image/<category>.jsonl）逐条打分。
# 每条 rubric 独立调用一次多模态 LLM，输入: case prompt + rubric + 一组渲染图。
# 输出: {"score": 0/1, "image_index": int, "reason": "..."}
# 参考实现: scripts/run_judge_eval.py:judge_run_rubric_image

judge_profile: junxiu_rubric_judge_vision
judge_model: "gemini-3.1-p-azure"   # 必须是支持多模态输入的模型 (supports_vision: true)
thinking: "off"
reasoning_effort: "low"

# 单条 rubric 最多投喂多少张图（pptx 总页数太多时均匀采样）
image_max: 20

# 渲染分辨率（pptx/docx → PNG）
render_dpi: 144

output_schema:
  type: object
  required: [score, image_index, reason]
  properties:
    score:
      type: integer
      enum: [0, 1]
      description: "1 = 视觉要素清晰存在；0 = 缺失或仅文字描述无图"
    image_index:
      type: integer
      description: "作为依据的图片在投喂列表中的 0-based 序号；无依据时 -1"
    reason:
      type: string
      description: "1-3 句中文说明，命名具体视觉要素与所在页/张"
