case_id: medical_ppt_presentation/medical_ppt_presentation_005
task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are a tertiary Grade A hospital hematologist. Please prepare a lecture PPT on early recognition of acute promyelocytic leukemia (APL), DIC management, and ATRA/ATO therapy, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: PML::RARα mechanism, early fatal risk from bleeding and thrombosis/embolism, WBC risk stratification, key points for recognition and management of differentiation syndrome.
  **Visual materials**: Flowchart from suspected APL to confirmed diagnosis; WBC-stratified ATRA+ATO treatment pathway diagram incorporating QTc and differentiation syndrome nodes; EFS/relapse-rate bar chart.
  **Constraints & format**: 14–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 14–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (PML::RARα mechanism, early fatal risk from bleeding and thrombosis/embolism, WBC risk stratification, key points for recognition and management of differentiation syndrome).
  3. Include the visual materials specified (Flowchart from suspected APL to confirmed diagnosis; WBC-stratified ATRA+ATO treatment pathway diagram incorporating QTc and differentiation syndrome nodes; EFS/relapse-rate bar chart).
attachments:
  - medical_ppt_presentation/medical_ppt_presentation_005/01_template.pptx
