task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are a pain medicine physician. Please prepare a lecture PPT on opioid-related adverse drug reactions, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: prevention of adverse reactions from the initiation of opioid therapy, increased risk from polypharmacy, recognition of nausea/constipation and delirium, early warning signs and management of respiratory depression, 5A/4A goals and dynamic reassessment.
  **Visual materials**: assessment–titration–stabilization follow-up flowchart; adverse reaction management pathway diagram; trend chart of cancer pain incidence and undertreatment (insufficient analgesia).
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (prevention of adverse reactions from the initiation of opioid therapy, increased risk from polypharmacy, recognition of nausea/constipation and delirium, early warning signs and management of respiratory depression, 5A/4A goals and dynamic reassessment).
  3. Include the visual materials specified (assessment–titration–stabilization follow-up flowchart; adverse reaction management pathway diagram; trend chart of cancer pain incidence and undertreatment (insufficient analgesia)).
attachments:
