prompt: |
  [Task Prompt]
  You are an ophthalmologist (glaucoma specialist). Please prepare a lecture PPT on diagnostic and treatment strategies for POAG/ocular hypertension, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: IOP lowering to slow visual field progression, limitations of the >21 mmHg threshold, OHTS/EGPS quantitative risk stratification, target IOP setting.
  **Visual materials**: Initial visit–follow-up assessment flowchart; target IOP stratification and stepwise treatment pathway diagram; schematic diagram of CCT-related tonometry measurement error.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (IOP lowering to slow visual field progression, limitations of the >21 mmHg threshold, OHTS/EGPS quantitative risk stratification, target IOP setting).
  3. Include the visual materials specified (Initial visit–follow-up assessment flowchart; target IOP stratification and stepwise treatment pathway diagram; schematic diagram of CCT-related tonometry measurement error).
attachments:
