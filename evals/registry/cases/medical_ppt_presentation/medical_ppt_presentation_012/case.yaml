case_id: medical_ppt_presentation/medical_ppt_presentation_012
task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are an oncologist. Please prepare a lecture PPT on drug–drug interactions (DDIs) and polypharmacy management in cancer treatment, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: pharmacovigilance perspective, mechanisms by which DDIs trigger adverse drug reactions (ADRs), risk-factor stratification, key points of polypharmacy management.
  **Visual materials**: polypharmacy–DDI risk assessment flowchart; high-risk DDI management pathway diagram; comorbidity incremental trend chart or a bar chart of adverse reactions in radiation enteritis.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (pharmacovigilance perspective, mechanisms by which DDIs trigger adverse drug reactions (ADRs), risk-factor stratification, key points of polypharmacy management).
  3. Include the visual materials specified (polypharmacy–DDI risk assessment flowchart; high-risk DDI management pathway diagram; comorbidity incremental trend chart or a bar chart of adverse reactions in radiation enteritis).
attachments:
  - medical_ppt_presentation/medical_ppt_presentation_012/01_template.pptx
