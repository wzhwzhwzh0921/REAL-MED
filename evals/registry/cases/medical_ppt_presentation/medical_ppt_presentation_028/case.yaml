case_id: medical_ppt_presentation/medical_ppt_presentation_028
task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are an ICU physician. Please prepare a lecture PPT on prescribing and complication management of parenteral nutrition (PN/TPN/SPN) in critically ill patients, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: prevalence of malnutrition and its association with clinical outcomes, nutrition risk stratification and timing of initiation, indications for PN/SPN and key prescribing points, monitoring and management of common complications.
  **Visual materials**: flowchart of risk stratification → EN proportion → PN/SPN start/stop; diagram of PN prescription stepwise escalation and complication monitoring; table of selection criteria for peripheral venous vs central venous access.
  **Constraints & format**: 14–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 14–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (prevalence of malnutrition and its association with clinical outcomes, nutrition risk stratification and timing of initiation, indications for PN/SPN and key prescribing points, monitoring and management of common complications).
  3. Include the visual materials specified (flowchart of risk stratification → EN proportion → PN/SPN start/stop; diagram of PN prescription stepwise escalation and complication monitoring; table of selection criteria for peripheral venous vs central venous access).
attachments:
  - medical_ppt_presentation/medical_ppt_presentation_028/01_template.pptx
