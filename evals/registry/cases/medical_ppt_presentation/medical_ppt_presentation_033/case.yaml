case_id: medical_ppt_presentation/medical_ppt_presentation_033
task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are a dermatologist at a top-tier tertiary hospital. Please prepare a lecture PPT on psoriasis relapse risk assessment and end-to-end management after treatment discontinuation, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: key points of chronic immune-mediated diseases, the IL-23/IL-17 axis, relapse risk factors (genetic and environmental triggers), post-discontinuation maintenance management and follow-up strategies.
  **Visual materials**: PASI and other assessments → stratification → decision-making flowchart; stepwise therapy and post-discontinuation management pathway diagram; prevalence and trend chart of specialty clinic coverage rate.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (key points of chronic immune-mediated diseases, the IL-23/IL-17 axis, relapse risk factors (genetic and environmental triggers), post-discontinuation maintenance management and follow-up strategies).
  3. Include the visual materials specified (PASI and other assessments → stratification → decision-making flowchart; stepwise therapy and post-discontinuation management pathway diagram; prevalence and trend chart of specialty clinic coverage rate).
attachments:
  - medical_ppt_presentation/medical_ppt_presentation_033/01_template.pptx
