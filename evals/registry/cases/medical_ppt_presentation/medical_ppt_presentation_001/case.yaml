case_id: medical_ppt_presentation/medical_ppt_presentation_001
task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are a cardiologist (structural heart disease specialist). Please prepare a lecture PPT on Mitral Regurgitation (MR) and Transcatheter Edge-to-Edge Repair (TEER), drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: mechanisms of leaflet coaptation failure, pre-TEER three-zone assessment, key anatomic thresholds, integrated perioperative risk assessment.
  **Visual materials**: flowchart of three-zone assessment and threshold criteria; pathway diagram from EuroSCORE II/STS to TEER vs surgical management; TEE views with MR comparison before and after clip implantation.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (mechanisms of leaflet coaptation failure, pre-TEER three-zone assessment, key anatomic thresholds, integrated perioperative risk assessment).
  3. Include the visual materials specified (flowchart of three-zone assessment and threshold criteria; pathway diagram from EuroSCORE II/STS to TEER vs surgical management; TEE views with MR comparison before and after clip implantation).
attachments:
  - medical_ppt_presentation/medical_ppt_presentation_001/01_template.pptx
