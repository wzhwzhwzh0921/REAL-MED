case_id: medical_ppt_presentation/medical_ppt_presentation_006
task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are a general surgeon (hepatobiliary surgeon). Please prepare a lecture PPT on acute calculous cholecystitis and minimally invasive/robotic cholecystectomy, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: inflammation–infection progression and risk of biliary tract involvement, risk stratification of high-risk populations, TG18 diagnostic key points and Grade I/II/III severity grading, perioperative risk assessment and key points for preventing bile duct injury.
  **Visual materials**: TG18 diagnostic grading flowchart; treatment decision tree; schematic diagram of the difficult Calot’s triangle and clip placement position.
  **Constraints & format**: 14–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 14–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (inflammation–infection progression and risk of biliary tract involvement, risk stratification of high-risk populations, TG18 diagnostic key points and Grade I/II/III severity grading, perioperative risk assessment and key points for preventing bile duct injury).
  3. Include the visual materials specified (TG18 diagnostic grading flowchart; treatment decision tree; schematic diagram of the difficult Calot’s triangle and clip placement position).
attachments:
  - medical_ppt_presentation/medical_ppt_presentation_006/01_template.pptx
