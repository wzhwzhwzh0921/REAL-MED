prompt: |
  [Task Prompt]
  You are an anesthesiologist. Please prepare a lecture PPT on residual neuromuscular blockade (RNMB/PRNB), drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: PRNB mechanisms and respiratory risks, depth of blockade and monitoring strategies, incidence and underestimation of risk, key points of pre-extubation safety assessment.
  **Visual materials**: Monitoring–reversal–extubation workflow flowchart; Neostigmine vs sugammadex decision pathway diagram; PRNB incidence and PACU respiratory complication risk chart/figure.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (PRNB mechanisms and respiratory risks, depth of blockade and monitoring strategies, incidence and underestimation of risk, key points of pre-extubation safety assessment).
  3. Include the visual materials specified (Monitoring–reversal–extubation workflow flowchart; Neostigmine vs sugammadex decision pathway diagram; PRNB incidence and PACU respiratory complication risk chart/figure).
attachments:
