case_id: medical_ppt_presentation/medical_ppt_presentation_017
task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are a rehabilitation medicine physician at a tertiary (Grade A) hospital. Please prepare a lecture PPT on non-surgical management of knee osteoarthritis (KOA) and the indications/positioning of extracorporeal shock wave therapy (ESWT), drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: degenerative characteristics and disease burden, risk factor stratification, obesity-related risk and key points for etiologic attribution, indications and positioning of ESWT within the non-surgical management framework.
  **Visual materials**: KOA diagnostic flowchart; stepwise non-surgical management and ESWT positioning diagram; annotated table of the three major X-ray signs with a Kellgren–Lawrence (K–L) grading crosswalk.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (degenerative characteristics and disease burden, risk factor stratification, obesity-related risk and key points for etiologic attribution, indications and positioning of ESWT within the non-surgical management framework).
  3. Include the visual materials specified (KOA diagnostic flowchart; stepwise non-surgical management and ESWT positioning diagram; annotated table of the three major X-ray signs with a Kellgren–Lawrence (K–L) grading crosswalk).
attachments:
  - medical_ppt_presentation/medical_ppt_presentation_017/01_template.pptx
