task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are a urologist. Please prepare a lecture PPT on biopsy strategies for suspected/newly diagnosed prostate cancer, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: diagnostic pathway, biopsy gold standard, PI-RADS risk-stratified decision-making, key points for delaying/avoiding biopsy.
  **Visual materials**: diagnostic workflow flowchart for suspected PCa; PI-RADS = 3 branching decision tree and biopsy pathway diagram; staging workup pathway diagram.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (diagnostic pathway, biopsy gold standard, PI-RADS risk-stratified decision-making, key points for delaying/avoiding biopsy).
  3. Include the visual materials specified (diagnostic workflow flowchart for suspected PCa; PI-RADS = 3 branching decision tree and biopsy pathway diagram; staging workup pathway diagram).
attachments:
  - medical_ppt_presentation/medical_ppt_presentation_011/01_template.pptx
