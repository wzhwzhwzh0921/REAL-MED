task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are a hospital infection management physician. Please prepare a lecture PPT on preoperative MRSA decolonization and targeted SSI prevention, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: mechanism by which colonization increases bacterial burden and SSI risk; SA/MRSA risk assessment for different surgical procedure types; key points of closed-loop management for screening → decolonization → targeted perioperative antimicrobial prophylaxis (PAP).
  **Visual materials**: screening → decolonization → PAP triage flowchart; PAP medication pathway diagram (mark key decision nodes); infographic on SSI burden and risk factors.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (mechanism by which colonization increases bacterial burden and SSI risk; SA/MRSA risk assessment for different surgical procedure types; key points of closed-loop management for screening → decolonization → targeted perioperative antimicrobial prophylaxis (PAP)).
  3. Include the visual materials specified (screening → decolonization → PAP triage flowchart; PAP medication pathway diagram (mark key decision nodes); infographic on SSI burden and risk factors).
attachments:
