task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are a cardiologist. Please prepare a lecture PPT on initial triage/risk stratification of chest pain in coronary artery disease (CAD) and secondary prevention, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: mechanism of atherosclerosis-induced ischemia and necrosis, initial chest pain screening workflow, CCS pre-test probability stratification, risk factor management with a focus on lipids and blood glucose.
  **Visual materials**: flowchart of chest pain → ECG → pre-test probability → test selection; pathway diagram for secondary prevention plus cardiac rehabilitation and follow-up after CCS confirmation; SCD risk trend chart.
  **Constraints & format**: 14–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 14–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (mechanism of atherosclerosis-induced ischemia and necrosis, initial chest pain screening workflow, CCS pre-test probability stratification, risk factor management with a focus on lipids and blood glucose).
  3. Include the visual materials specified (flowchart of chest pain → ECG → pre-test probability → test selection; pathway diagram for secondary prevention plus cardiac rehabilitation and follow-up after CCS confirmation; SCD risk trend chart).
attachments:
  - medical_ppt_presentation/medical_ppt_presentation_009/01_template.pptx
