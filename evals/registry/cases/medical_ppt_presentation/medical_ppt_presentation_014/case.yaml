prompt: |
  [Task Prompt]
  You are a clinical pharmacist. Please prepare a lecture PPT on quality control (QC) for geriatric polypharmacy management, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: baseline status and harms, risk stratification and associations with PIM/DDIs, promotion of a QC closed-loop, key indicator setting and trend tracking.
  **Visual materials**: QC closed-loop flowchart; deprescribing stepwise pathway diagram; polypharmacy and ADR data trend chart.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (baseline status and harms, risk stratification and associations with PIM/DDIs, promotion of a QC closed-loop, key indicator setting and trend tracking).
  3. Include the visual materials specified (QC closed-loop flowchart; deprescribing stepwise pathway diagram; polypharmacy and ADR data trend chart).
attachments:
  - medical_ppt_presentation/medical_ppt_presentation_014/01_template.pptx
