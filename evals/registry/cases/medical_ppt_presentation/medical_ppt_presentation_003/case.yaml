  1. Be 14–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (Features of Th2 activation, IL-4/IL-13 pathogenic mechanisms, the vicious cycle of skin barrier defects and inflammation interaction, treatment risks and key monitoring points).
  3. Include the visual materials specified (SCORAD stratified assessment flowchart; stepwise treatment pathway diagram (including sequential/combination strategies); barrier–Th2 vicious cycle schematic diagram).
