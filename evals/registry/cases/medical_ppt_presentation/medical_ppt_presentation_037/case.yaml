  The `.pptx` deck must:
  1. Be 14–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (droplet transmission, clinical course staging, atypical presentations in infants, household exposure risk).
  3. Include the visual materials specified (diagnostic–reporting–isolation workflow flowchart; referral pathway diagram triggered by WBC thresholds + severe manifestations; incubation period and infectious period timeline).
