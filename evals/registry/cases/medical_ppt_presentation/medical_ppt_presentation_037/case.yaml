  **Visual materials**: diagnostic–reporting–isolation workflow flowchart; referral pathway diagram triggered by WBC thresholds + severe manifestations; incubation period and infectious period timeline.
  **Constraints & format**: 14–16 slides, with speaker notes.
  
  [Answer Format]
