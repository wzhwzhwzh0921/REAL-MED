prompt: |
  [Task Prompt]
  You are a rheumatology/immunology and nephrology physician. Please prepare a lecture PPT on ANCA-Associated Vasculitis (AAV), drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: small-vessel autoimmune inflammation and multi-organ damage, key points of GPA/MPA/EGPA, recognition of pulmonary–renal syndrome, glucocorticoid-associated infection risk and prevention/mitigation.
  **Visual materials**: flowchart for suspected AAV evaluation–exclusion–classification; treatment pathway diagram for induction–maintenance–relapse monitoring; visual cue diagram or epidemiology figure highlighting pulmonary–renal involvement.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (small-vessel autoimmune inflammation and multi-organ damage, key points of GPA/MPA/EGPA, recognition of pulmonary–renal syndrome, glucocorticoid-associated infection risk and prevention/mitigation).
  3. Include the visual materials specified (flowchart for suspected AAV evaluation–exclusion–classification; treatment pathway diagram for induction–maintenance–relapse monitoring; visual cue diagram or epidemiology figure highlighting pulmonary–renal involvement).
