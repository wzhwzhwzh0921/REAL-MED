prompt: |
  [Task Prompt]
  You are a psychiatrist. Please prepare a lecture PPT on diagnostic updates and full-cycle management of bipolar disorder, drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: alternating features of mania/hypomania and depression, genetic and biopsychosocial mechanisms, relapse and suicide risk, key points of full-cycle management.
  **Visual materials**: diagnostic subtype flowchart; acute–continuation–maintenance treatment pathway diagram; epidemiology and risk-burden trend chart.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (alternating features of mania/hypomania and depression, genetic and biopsychosocial mechanisms, relapse and suicide risk, key points of full-cycle management).
  3. Include the visual materials specified (diagnostic subtype flowchart; acute–continuation–maintenance treatment pathway diagram; epidemiology and risk-burden trend chart).
attachments:
