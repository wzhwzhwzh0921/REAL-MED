task_type: medical_ppt_presentation
prompt: |
  [Task Prompt]
  You are a gastroenterologist. Please prepare a lecture PPT on the diagnosis, treatment, and follow-up of inflammatory bowel disease (ulcerative colitis/Crohn’s disease), drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: multifactorial pathogenesis, Montreal classification, disease activity assessment, vigilance for high-risk CDI.
  **Visual materials**: diagnostic flowchart; induction–maintenance–monitoring pathway diagram; incidence trend chart.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (multifactorial pathogenesis, Montreal classification, disease activity assessment, vigilance for high-risk CDI).
  3. Include the visual materials specified (diagnostic flowchart; induction–maintenance–monitoring pathway diagram; incidence trend chart).
attachments:
  - medical_ppt_presentation/medical_ppt_presentation_010/01_template.pptx
