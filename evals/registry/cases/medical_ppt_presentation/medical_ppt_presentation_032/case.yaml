prompt: |
  [Task Prompt]
  You are a urologist. Please prepare a lecture PPT on biomarker-guided therapy and combined endocrine treatment strategies for advanced/metastatic prostate cancer (PTEN loss–related), drawing on the latest authoritative guidelines.
  **Core content (including but not limited to)**: definitions of locally advanced/regional/metastatic disease, PTEN/AKT abnormalities, mechanisms of progression to CRPC, staging- and risk-stratified decision-making.
  **Visual materials**: diagnostic pathway flowchart; treatment stepwise ladder/risk-stratified decision diagram; incidence and mortality trend bar chart.
  **Constraints & format**: 12–16 slides, with speaker notes.
  
  [Answer Format]
  [Template instructions] This task includes a PPTX template file (`01_template.pptx`). Please generate the PPT based on the overall style, layout constraints, and master slide system of this template, retaining the template's color scheme, fonts, and layout logic.
  The `.pptx` deck must:
  1. Be 12–16 slides total, each with speaker notes.
  2. Cover the core content listed in the Task Prompt above (definitions of locally advanced/regional/metastatic disease, PTEN/AKT abnormalities, mechanisms of progression to CRPC, staging- and risk-stratified decision-making).
  3. Include the visual materials specified (diagnostic pathway flowchart; treatment stepwise ladder/risk-stratified decision diagram; incidence and mortality trend bar chart).
