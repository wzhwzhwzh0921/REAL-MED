case_id: medical_literature_review/medical_literature_review_011
task_type: medical_literature_review
prompt: |
  [Task Prompt]
  You are a physician in the Department of Respiratory and Critical Care Medicine. In outpatient practice over the past two years, you have observed an increasing detection rate of pulmonary nodules among never-smoking women, and many patients report exposure histories such as secondhand smoke or cooking oil fumes. However, current enrollment criteria based on “age + exposure history” have led to strained LDCT resources and a low positive predictive value. Therefore, you plan to write a scoping review on “risk prediction models and LDCT strategies for lung cancer screening in high-risk never-smoking women (exposed to cooking oil fumes/secondhand smoke)”, intended to inform and optimize screening eligibility and pathway design in clinical practice.
  
  Topic: Risk prediction models and LDCT screening strategies for high-risk lung cancer screening in never-smoking women (cooking oil fumes/secondhand smoke exposure).
  
  The review must systematically compile and analyze the following core content:
  1. The landscape of risk prediction models for never-smoking women and their included variables;
  2. Risk stratification thresholds and screening efficiency metrics;
  3. Model accuracy and performance in external validation;
  4. Comparison with the screening strategy in the Chinese Medical Association “Chinese Guidelines for Clinical Diagnosis and Treatment of Lung Cancer (2025 Edition)” (《中华医学会肺癌临床诊疗指南（2025版）》).
  
  Search and include studies using the following keywords: lung cancer screening、risk prediction model、never-smoker women、secondhand smoke、cooking oil fumes/indoor air pollution、LDCT. A standardized reference list must be provided at the end of the review; it is recommended to use a PRISMA-ScR flow diagram to show the screening process, a comparative table summarizing each model’s population, variables, AUC/calibration and detection rate, and a stratified flowchart to present the proposed screening pathway.
  [Answer Format]
  Use the `docx` skill to save the complete literature review as a Word document (`.docx`) and submit it through the `present_files` tool. Plain-text-only responses, PDF, or markdown final deliverables are not accepted. Intermediate research notes may be `.md`, but the final deliverable must be `.docx`.
  **Hard scoring constraint: if no `.docx` is submitted via `present_files`, this question is automatically scored 0.**
  The `.docx` review must include:
  - A structured body covering all the content items listed in the [Task Prompt].
  - A standardized reference list at the end with **≥15 references**, of which **≥50% are from the past 5 years**.
