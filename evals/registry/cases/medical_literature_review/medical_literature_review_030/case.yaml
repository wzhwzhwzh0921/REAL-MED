case_id: medical_literature_review/medical_literature_review_030
task_type: medical_literature_review
prompt: |
  [Task Prompt]
  You are a physician in Respiratory and Critical Care Medicine. During outpatient follow-up of multiple adult patients with ABPA (allergic bronchopulmonary aspergillosis), you observed that some patients repeatedly worsen after tapering oral corticosteroids, and that patients with concomitant severe asthma have poor adherence to traditional regimens and experience more adverse effects. Therefore, you are particularly interested in the real-world use of biologics targeting type 2 inflammation in ABPA. You have recently reviewed some of the literature and plan to write a scoping review primarily based on case series and real-world studies, with the theme: “Efficacy and Quality of Evidence for Type 2 Inflammation–Targeted Biologics in ABPA,” intended to inform clinical practice and evidence appraisal in routine care.
  
  Topic: Efficacy and Quality of Evidence for Type 2 Inflammation–Targeted Biologics in ABPA (scoping review focusing on case series and real-world studies).
  
  The review must systematically compile and analyze the following core content:
  1. Biologic selection and population stratification (asthma/CF);
  2. Feasibility of oral corticosteroid tapering and discontinuation;
  3. Relapse/exacerbation outcomes and re-treatment strategies;
  4. Safety and fungal burden–related risks (with reference to the “ABPA诊治专家共识2022”).
  
  Search and inclusion keywords: ABPA, omalizumab, mepolizumab/benralizumab, dupilumab, real-world/case series. A standardized reference list must be provided at the end of the review; additionally, use a PRISMA-ScR flow diagram to show the screening process, use comparative tables to summarize steroid tapering, relapse, and safety outcomes across different biologics, and present a timeline figure showing IgE/eosinophils and imaging follow-up trajectories for typical cases.
  [Answer Format]
  Use the `docx` skill to save the complete literature review as a Word document (`.docx`) and submit it through the `present_files` tool. Plain-text-only responses, PDF, or markdown final deliverables are not accepted. Intermediate research notes may be `.md`, but the final deliverable must be `.docx`.
  **Hard scoring constraint: if no `.docx` is submitted via `present_files`, this question is automatically scored 0.**
  The `.docx` review must include:
  - A structured body covering all the content items listed in the [Task Prompt].
  - A standardized reference list at the end with **≥15 references**, of which **≥50% are from the past 5 years**.
