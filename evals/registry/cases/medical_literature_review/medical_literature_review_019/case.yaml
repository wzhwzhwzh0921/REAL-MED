case_id: medical_literature_review/medical_literature_review_019
task_type: medical_literature_review
prompt: |
  [Task Prompt]
  You are a nephrologist who has seen multiple outpatients with CKD G1–G4 complicated by atrial fibrillation (AF). You have observed substantial variability in oral anticoagulation prescribing, with particularly prominent controversy regarding drug selection and perioperative interruption among high-risk borderline populations with CKD G4–G5. Therefore, you plan to write a systematic review for clinical decision-making on oral anticoagulation strategies in patients with CKD and AF, intended to inform outpatient practice and perioperative management.
  
  Topic: “Oral anticoagulation strategies in patients with CKD complicated by atrial fibrillation (NOACs vs warfarin): a systematic review.”
  
  The review must systematically compile and analyze the following core content:
  1. Comparative efficacy outcomes of oral anticoagulants (OAC) across CKD stratifications;
  2. Bleeding safety and net clinical benefit assessment;
  3. Key points for selecting and dosing NOACs versus warfarin across different CKD stages and different eGFR levels;
  4. Key points for perioperative interruption and bridging strategies.
  
  Search and inclusion must use the following keywords: atrial fibrillation、chronic kidney disease、oral anticoagulants/NOAC/warfarin、bleeding、perioperative interruption. A standardized reference list must be provided at the end of the review.
  
  [Answer Format]
  Use the `docx` skill to save the complete literature review as a Word document (`.docx`) and submit it through the `present_files` tool. Plain-text-only responses, PDF, or markdown final deliverables are not accepted. Intermediate research notes may be `.md`, but the final deliverable must be `.docx`.
  **Hard scoring constraint: if no `.docx` is submitted via `present_files`, this question is automatically scored 0.**
  The `.docx` review must include:
  - A structured body covering all the content items listed in the [Task Prompt].
  - A standardized reference list at the end with **≥15 references**, of which **≥50% are from the past 5 years**.
