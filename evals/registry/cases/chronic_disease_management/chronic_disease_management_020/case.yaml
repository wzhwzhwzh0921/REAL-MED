  **Case ID:`chronic_disease_management_020`chronic_disease_management_020`
  
  A 65-year-old Ms. Wang was admitted for abdominal distension and poor appetite. Evaluation strongly suggests advanced ovarian cancer. Contrast-enhanced CT and preliminary diagnostic laparoscopy assessment indicate a relatively high tumor burden, with a Fagotti score of 8, which implies that achieving optimal cytoreduction (R0) via primary debulking surgery (PDS) may be difficult; this is a borderline case between PDS and neoadjuvant chemotherapy (NACT). The patient has good cardiopulmonary function and no major contraindications to surgery.
  
  During the MDT discussion, the gynecologic oncology surgeon assessed that surgery would be very challenging, but not entirely impossible to achieve satisfactory resection. Meanwhile, the molecular pathology department reported that, due to an unexpected failure of the core sequencing equipment now under repair, an NGS report—including HRD testing—cannot be issued for the next 4–6 weeks.
  
  The team needs to formulate the best initial treatment strategy for Ms. Wang. Considering the high difficulty and high risk of surgery, and the advantages of NACT in effectively downstaging disease and assessing chemosensitivity, there is disagreement about choosing PDS versus NACT.
  
  **Patient information:**
  - Name: Ms. Wang, female, 65 years old, retired teacher
  - Chief complaint: Progressive abdominal distension with decreased appetite for more than 2 months.
  - History of present illness: Two months ago, the patient developed abdominal distension and poor appetite without an obvious trigger and noticed an increased waist circumference. She initially thought it was indigestion and did not pay attention. Over the past month, symptoms worsened, accompanied by mild nausea and fatigue, with no significant weight change. She came to our hospital for evaluation; physical examination and imaging findings strongly suggested advanced ovarian cancer, and she was admitted for further diagnosis and treatment.
  - Past medical history: History of hypertension for 10 years; takes medications regularly with good blood pressure control. History of type 2 diabetes for 5 years; treated with oral metformin; fasting blood glucose maintained at 6–7 mmol/L.
  - Current medications: valsartan 80mg qd; metformin 0.5g bid
  - Lifestyle: Does not smoke or drink alcohol. After retirement, maintains a regular routine and insists on walking daily. Overall health status is good.
  - Vital signs: blood_pressure=135/82 mmHg；heart_rate=78 bpm；respirations=18次/分；temperature=36.8℃；ECOG score=1
  - Physical examination: Alert and oriented, in fair condition. No abnormalities on cardiac and pulmonary auscultation. Abdomen distended; no tenderness throughout; shifting dullness positive. Gynecologic exam: vulva and vagina normal; cervix smooth; uterus normal size without tenderness; bilateral adnexal regions with fixed, irregular masses with unclear borders, approximately 10x8cm, tender.
  - Ancillary tests: CBC, liver and kidney function, electrolytes, and coagulation function all within normal limits. CA125: 1350 U/mL (reference <35). HE4: 380 pmol/L (reference <140). Contrast-enhanced abdominopelvic CT: irregular solid masses in bilateral adnexal regions, considered ovarian in origin, maximum diameter about 9.5cm; omental thickening with “omental cake”; multiple peritoneal implants at the peritoneum, mesenteric root, and right diaphragmatic surface, largest about 2cm; massive ascites. Diagnostic laparoscopy assessment: Fagotti score 8.
  
