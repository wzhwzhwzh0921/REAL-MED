  **Case ID:`chronic_disease_management_020`chronic_disease_management_020`. The patient’s complete clinical data has been provided above; there is no need to call any case-loading tool again. Please directly use the currently available Chronic-System HIS tools to enter necessary orders in sequence—diagnoses, prescriptions, lab tests, imaging, follow-up plan, etc. After completion, use the available HIS submit tool to confirm and submit the orders. Do not request clarification merely because a tool’s display name differs slightly from its description. When calling the submit tool, you must fill in the `analysis_conclusion` parameter and provide as detailed a final analysis as possible, covering diagnostic basis, risk stratification or disease severity, rationale for treatment choice, testing and monitoring arrangements, follow-up plan, and necessary up-referral or referral considerations.
  
