case_id: chronic_disease_management/chronic_disease_management_014
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  In the endocrinology outpatient clinic, you meet Mr. Wang, a 30-year-old software engineer. He looks tired and somewhat anxious. He complains: “Doctor, why is my ‘type 2 diabetes’ getting worse the more it’s treated? I take my medicine on time and I don’t eat much, but I’ve lost 10 jin in the past three months, I’m thirsty all day, and my blood sugar is still so high.”
  
  You carefully review the community hospital medical records he brought, which clearly document a diagnosis of “type 2 diabetes mellitus” and a treatment regimen of metformin combined with a sulfonylurea. However, Mr. Wang’s clinical features—young age at onset, lean body habitus (BMI 19.6 kg/m²), very poor response to combination therapy with two oral hypoglycemic agents, and recent marked weight loss and hyperglycemic symptoms—make you question this diagnosis. You look at the newly available lab report: fasting blood glucose 14.5 mmol/L and HbA1c as high as 9.8%; even more concerning, the urinalysis shows ketones (+).
  
  All of this seems to be pointing in a direction completely different from “type 2 diabetes.” You realize that establishing the correct diabetes subtype is the top priority for the current treatment decision-making, as it directly affects the patient’s future treatment plan and long-term prognosis. An incorrect diagnosis and treatment will not only be ineffective, but may also delay proper care and lead to serious acute complications.
  
  **Patient information:**
  - Name: Mr. Wang, male, 30 years old, software engineer
  - Chief complaint: Poor glycemic control after 3 months of oral hypoglycemic therapy, with worsening dry mouth, polydipsia, and weight loss for 1 month.
  - History of present illness: Three months ago, the patient was found to have a fasting blood glucose of 10.2 mmol/L during a workplace health check. A community hospital diagnosed him with “type 2 diabetes mellitus.” At that time, he had no obvious “three polys and one loss” symptoms and had a lean build. A community physician prescribed oral “metformin”; due to poor glycemic control, “gliclazide” was later added. Over the past month, the patient has noticed marked dry mouth, polydipsia, and polyuria, with nocturia 2–3 times per night, easy fatigue, and weight loss of about 5 kg since onset. Self-monitoring shows fasting capillary glucose mostly 12–15 mmol/L, and 2-hour postprandial glucose often >16 mmol/L. He presents to the endocrinology clinic of our hospital for further evaluation and treatment.
  - Past medical history: History of hyperuricemia for 3 years, not taking regular medications, mainly controlled by diet; history of allergic rhinitis for more than 10 years.
  - Current medications: Metformin tablets 0.5g tid, gliclazide modified-release tablets 30mg qd
  - Lifestyle: Office work, sedentary for more than 8 hours daily; irregular meals, but reports not eating large amounts. No alcohol use history; quit smoking 1 year ago.
  - Vital signs: blood_pressure=125/80 mmHg；heart_rate=88 bpm；temperature=36.8℃；respiration_rate=18 breaths/min
  - Physical examination: Height 175cm, weight 60kg, BMI 19.6 kg/m². Conscious and alert, fair general condition, with an acute-illness appearance. Slightly decreased skin turgor. No palpable thyroid enlargement. No abnormalities on cardiac and pulmonary auscultation. Abdomen soft and flat, no tenderness. No edema in both lower extremities; dorsalis pedis pulses palpable.
  - Ancillary tests: Outpatient urgent tests: fasting plasma glucose 14.5 mmol/L; glycated hemoglobin (HbA1c) 9.8%; urinalysis: glucose (++++), ketones (+). Liver and kidney function, lipids: serum creatinine 80 μmol/L, eGFR > 90 ml/min/1.73m²; triglycerides 2.1 mmol/L.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
