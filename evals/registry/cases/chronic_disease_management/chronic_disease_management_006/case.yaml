case_id: chronic_disease_management/chronic_disease_management_006
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  You are a community general practitioner. In front of you is a chronic-disease patient whose complete clinical data has been loaded in the system.
  
  You have connected to the hospital HIS system and can complete diagnosis and treatment operations via system tools. Based on the patient’s clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  
  After completing all clinical decisions, please confirm and submit the medical orders.
  
  45-year-old software engineer Mr. Wang presents after elevated blood pressure was found during a health checkup. After three measurements on non-consecutive days, today you have established the diagnosis of “primary hypertension (Grade 1)” for him. Mr. Wang is somewhat concerned about the need for long-term medication and proactively asks you: “Doctor, besides taking medicine, what should I pay attention to in daily life? I heard the main thing is to eat less salt—what exactly should I do?”
  
  **Patient information:**
  - Name: Mr. Wang, male, 45 years old, software engineer
  - Chief complaint: Elevated blood pressure found on physical examination for 1 week
  - History of present illness: One week ago during the employer’s annual health checkup, blood pressure was 148/94 mmHg; no special management was given at that time. Today he came to the community health service center for recheck. During this period, there have been no symptoms such as dizziness, headache, chest tightness, or other discomfort.
  - Past medical history: Hyperlipidemia noted on physical examination for 2 years, not taking medication regularly; no history of diabetes or coronary heart disease; father has a history of hypertension
  - Current medications: None
  - Lifestyle: Busy work schedule with long-term sedentary behavior; exercises less than 1 hour per week. Drinks 2–3 cups of coffee daily for stimulation. Dinner is often takeout or business/social meals, with a preference for salty flavors. Recently under high pressure due to a project launch, often stays up until 1–2 a.m. and reports poor sleep quality.
  - Vital signs: blood_pressure=146/92 mmHg (right upper arm, after sitting quietly for 5 minutes); heart_rate=82 bpm; BMI=27.5 kg/m²
  - Physical examination: Alert and oriented; no obvious abnormalities on cardiac, pulmonary, or abdominal examination; no edema in both lower extremities.
  - Ancillary tests: Serum potassium 4.1 mmol/L, serum creatinine 85 μmol/L, fasting plasma glucose 5.8 mmol/L, total cholesterol 5.9 mmol/L, LDL-C 3.8 mmol/L.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
