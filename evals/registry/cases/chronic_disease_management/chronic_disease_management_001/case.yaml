case_id: chronic_disease_management/chronic_disease_management_001
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  Mr. Wang, a 58-year-old man, is a conscientious and responsible middle-school teacher. He has a 5-year history of type 2 diabetes and has consistently taken oral metformin, with fairly good glycemic control. Today, he comes to the community health service center for his annual physical examination.
  
  During the consultation, Mr. Wang reports no discomfort and continues teaching as usual. The physician reviews his records and notes that his in-clinic blood pressure readings over the past month have been stable but consistently hover around 135/85 mmHg; today’s reading is 136/88 mmHg. Relevant laboratory tests show normal renal function, but mildly elevated lipids. At present, aside from metformin, he is not taking any other medications.
  
  Given Mr. Wang’s situation, the physician needs to formulate the next-step management plan for him.
  
  **Patient information:**
  - Name: Wang Jianguo, male, 58 years old, middle-school teacher
  - Chief complaint: Annual community outpatient physical examination; no special discomfort.
  - History of present illness: Diagnosed with type 2 diabetes 5 years ago and has been taking oral metformin to control blood glucose. Over the past year, home-measured blood pressure has fluctuated between 130-140/80-90 mmHg without any specific intervention. This visit is a routine community follow-up. Over the past 1 month, blood pressure was measured three times in the clinic on different dates: 136/88 mmHg, 138/86 mmHg, and 135/88 mmHg. The patient has no symptoms such as dizziness, headache, chest tightness, or palpitations.
  - Past medical history: Type 2 diabetes for 5 years, regular medication use, glycemic control acceptable; no history of coronary heart disease, stroke, or other cardiovascular/cerebrovascular disease
  - Current medications: Metformin hydrochloride tablets 0.5g tid
  - Lifestyle: Sedentary office work; exercises about once per week (walking); reports a salty diet; does not smoke; occasional small amounts of alcohol
  - Vital signs: blood_pressure=136/88 mmHg；heart_rate=76 bpm；BMI=27.0 kg/m² (height 172cm, weight 80kg)
  - Physical examination: Alert and oriented; no abnormalities on cardiac and pulmonary auscultation; no edema in both lower extremities.
  - Ancillary tests: Fasting plasma glucose (FPG): 7.2 mmol/L; glycated hemoglobin (HbA1c): 6.8%; serum creatinine (Cr): 85 μmol/L; urinalysis: urine protein (-); lipids: total cholesterol 5.5 mmol/L, low-density lipoprotein cholesterol (LDL-C) 3.1 mmol/L.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
