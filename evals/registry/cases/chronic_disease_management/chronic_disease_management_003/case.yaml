case_id: chronic_disease_management/chronic_disease_management_003
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  A 50-year-old Ms. Wang is a middle school teacher. Recently, due to high work-related stress, she often feels anxious. One month ago, a physical examination found elevated blood pressure. Since then, every time she comes to the hospital for blood pressure measurement, it has hovered around 142/94 mmHg, which makes her even more nervous. You advised her to perform one week of home blood pressure monitoring. Today she returns for follow-up with a detailed blood pressure diary, which clearly documents that with standardized measurements, her 1-week average home blood pressure is 130/80 mmHg. She asks nervously, “Doctor, does this count as hypertension? Do I need to take medication?”
  
  **Patient information:**
  - Name: Ms. Wang, female, 50 years old, middle school teacher
  - Chief complaint: Elevated blood pressure found on physical examination for over 1 month
  - History of present illness: One month ago, blood pressure measured at a workplace physical examination was 145/95 mmHg and she was advised to recheck. Half a month ago, she visited a community hospital and her blood pressure was 142/94 mmHg. Today she returns for follow-up and her blood pressure is still 140/92 mmHg. She reports no obvious dizziness or headache. As instructed, she used an upper-arm electronic blood pressure monitor to measure at home in a standardized manner for one week (2–3 measurements each morning and evening, taking the average value) and brought the records to the visit. The records show a 1-week average home blood pressure of 130/80 mmHg.
  - Past medical history: Previously healthy. Over the past year, due to work stress she has noticed significant anxiety; sometimes experiences palpitations and insomnia.
  - Current medications: Not taking any antihypertensive medications or other long-term medications
  - Lifestyle: Non-smoker; occasional social alcohol use. Busy at work, irregular meals, and little exercise. Recently, for health reasons, has started to pay attention to a light diet.
  - Vital signs: blood_pressure=142/94 mmHg (right upper arm, office measurement)；heart_rate=88 bpm；respiratory_rate=18 breaths/min；temperature=36.7°C
  - Physical examination: Height 162cm, weight 65kg, BMI 24.8 kg/m². Alert and oriented. No obvious positive findings on cardiac, pulmonary, or abdominal examination; no edema in both lower extremities.
  - Ancillary tests: Complete blood count, urinalysis, liver and kidney function, fasting blood glucose, and full lipid panel are all within normal ranges.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
