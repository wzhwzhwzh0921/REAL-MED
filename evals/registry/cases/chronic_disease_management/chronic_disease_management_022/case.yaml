case_id: chronic_disease_management/chronic_disease_management_022
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  You are a community general practitioner. In front of you is a patient with a chronic condition, and the system has already loaded the patient’s complete clinical information.
  
  You are connected to the hospital HIS system and can complete diagnosis and treatment operations via system tools. Based on the patient’s clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  
  After completing all clinical decisions, please confirm and submit the medical orders.
  
  You are seeing Ms. Wang, a 50-year-old woman who underwent an external-hospital biopsy for “postcoital bleeding.” The pathology report is only briefly described as “cervical adenocarcinoma, moderately differentiated.” The patient and her family are extremely anxious and urgently want to understand the severity of the disease and the best next treatment plan. After carefully reviewing this somewhat “traditional” pathology report, you realize that more comprehensive information is needed to guide subsequent clinical decision-making, including selection of surgical extent and whether stronger adjuvant therapy is necessary.
  
  **Patient information:**
  - Name: Ms. Wang, female, 50 years old, accountant
  - Chief complaint: Postcoital bleeding for more than 1 month.
  - History of present illness: The patient reports that after 2 years of menopause, 1 month ago she developed a small amount of bright red vaginal bleeding after intercourse without an obvious trigger, and did not pay attention to it. Over the past 2 weeks, the bleeding has become more frequent than before, so she went to a local hospital. Gynecologic examination found an abnormal cervix; a cervical biopsy was performed. After the pathology result was reported, she came to our hospital for further diagnosis and treatment.
  - Past medical history: Menopause for 2 years; previously healthy; denies history of hypertension and diabetes; for the past 3 years, annual routine TCT and high-risk HPV testing have both been negative.
  - Current medications: None
  - Lifestyle: Sedentary office work, regular schedule, no smoking or alcohol use.
  - Vital signs: blood_pressure=125/78 mmHg；heart_rate=76 bpm；temperature=36.8°C；respiratory_rate=18 breaths/min
  - Physical examination: General condition fair. Gynecologic examination: vulva and vagina without abnormalities. Cervix is barrel-shaped and enlarged, diameter about 3 cm; a cauliflower-like neoplasm is visible on the surface, firm in texture and bleeds easily on touch. No definite abnormalities palpated in the uterus or bilateral adnexal regions.
  - Ancillary tests: External-hospital pathology report: (cervical biopsy) Microscopy shows atypical glands with infiltrative growth; diagnosis: “cervical adenocarcinoma, moderately differentiated.”
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
