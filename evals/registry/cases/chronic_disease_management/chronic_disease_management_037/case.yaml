case_id: chronic_disease_management/chronic_disease_management_037
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  At the mental health clinic of a community health service center, you see 15-year-old first-year high school student Wang Hao and his worried mother. Wang Hao’s mother first affirms the recent treatment response: “Doctor, since adding that small tablet (quetiapine), he sleeps much more soundly at night, doesn’t overthink, and his studying has improved a lot.”
  
  But then she changes tone, pointing at her slightly fatigued son: “However, he has gained almost 10 jin in the past three months, and he seems lazy and sluggish. What worries us most is that he’s a boy, but recently he keeps saying his chest hurts; we secretly felt it and it seems like there are small lumps inside. Does this medicine contain hormones? Will it affect his development? His dad is extremely anxious about this—do we need to stop the medication right away?”
  
  While reassuring the family, you perform a brief physical examination and confirm mild bilateral gynecomastia. Reviewing his medication history and the recent changes in weight, blood glucose, and lipids, you realize you are facing a classic adverse drug reaction management dilemma: balancing efficacy and side effects, especially in an adolescent at a critical stage of pubertal development.
  
  **Patient information:**
  - Name: Wang Hao, male, 15 years old, first-year high school student
  - Chief complaint: Follow-up evaluation; mood improved but weight gain with breast distension/pain for 3 months.
  - History of present illness: The patient was diagnosed 1 year ago with “major depressive disorder with psychotic features” due to persistent low mood, anhedonia, and referential delusions (believing classmates were colluding to talk about him behind his back and exclude him). Sertraline was initiated, with some improvement in mood, but referential delusions still fluctuated occasionally. Three months ago, the outpatient physician added low-dose quetiapine 100mg at night to enhance efficacy and improve sleep. After adding the medication, sleep quality improved significantly, referential delusions resolved, and study-related attention became more focused than before. However, over the past 3 months, the patient has gained 5 kg and reports “always feeling weak.” More troubling to the mother and child, over the past 1 month the patient has complained of bilateral breast distension/pain, with tenderness when changing clothes.
  - Past medical history: History of major depressive disorder for 1 year, diagnosis confirmed; no other physical disease history; no history of drug allergies.
  - Current medications: Sertraline hydrochloride tablets 150mg once nightly; quetiapine fumarate tablets 100mg once nightly (added in the past 3 months)
  - Lifestyle: Lives with parents; recently under significant academic stress preparing for final exams. Has a habit of drinking sugar-sweetened beverages to stay alert. Generally low level of physical activity.
  - Vital signs: blood_pressure=115/75 mmHg；heart_rate=80 bpm；temperature=36.6℃；respirations=18 次/分；bmi=22.5 kg/m² (3月前为20.8 kg/m²)
  - Physical examination: Conscious and alert, answers questions appropriately. No obvious abnormalities on heart, lung, and abdominal examination. Specialty examination: no obvious visible bilateral breast protrusion, but palpation reveals approximately 1.5cm×1.5cm glandular tissue beneath the areola on both sides, medium firmness, relatively clear borders, mild tenderness; no redness/swelling or increased skin temperature; no abnormal pulsation or masses palpated.
  - Ancillary tests: Fasting blood glucose 5.9 mmol/L, triglycerides 1.8 mmol/L. Liver and kidney function tests and complete blood count show no obvious abnormalities.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
