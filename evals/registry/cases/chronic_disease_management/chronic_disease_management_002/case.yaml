case_id: chronic_disease_management/chronic_disease_management_002
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  On Wednesday morning, sunlight streamed through the window into the consultation room of the community health service center. General practitioner Dr. Wang received Ms. Li Fang. Ms. Li looked somewhat fatigued, but her mental state was acceptable. She handed over a thick stack of medical records and a referral form.
  
  Dr. Wang quickly reviewed the referral form, which clearly stated: “Patient Li Fang, diagnosed status post right breast cancer surgery, has completed standard surgery and adjuvant chemotherapy. The condition is currently stable and adjuvant endocrine therapy has been initiated. She is now transferred to your center for subsequent chronic disease management and routine follow-up.”
  
  “Dr. Wang,” Ms. Li began uneasily, “the doctors at the provincial cancer hospital told me to report to you, and from now on I’ll be managed in the community. I still feel uneasy—can you manage such a serious illness here? What should I pay attention to in the future? When should I go back to the big hospital for re-examinations? I’ve been taking letrozole, and recently my joints have been aching—could this be a side effect? I’ve also always had high blood pressure and blood sugar—does that matter?” Ms. Li’s series of questions reflected her anxiety about the road to recovery ahead and her doubts about the community chronic-disease management model.
  
  **Patient information:**
  - Name: Li Fang, female, 52 years old, primary school teacher
  - Chief complaint: 3 months after right breast cancer surgery, presenting to the community hospital per superior hospital instructions to establish a record and undergo routine follow-up.
  - History of present illness: The patient was diagnosed 3 months ago at a provincial tertiary hospital (demonstration center) with “right breast invasive ductal carcinoma,” and underwent “modified radical mastectomy of right breast + axillary lymph node dissection.” Postoperative pathology: pT2N1M0 (stage IIB), ER(+++, 90%), PR(++, 70%), HER2(0), Ki-67(25%). Postoperatively completed 4 cycles of AC regimen (doxorubicin + cyclophosphamide) adjuvant chemotherapy; course was smooth. Started oral letrozole tablets 1 month ago as adjuvant endocrine therapy. Currently the patient’s general condition is acceptable with no special discomfort. She presents to the community health service center (prevention and treatment center) in her jurisdiction with the superior hospital referral form and medical records, requesting establishment of a chronic disease file and ongoing management.
  - Past medical history: Hypertension for 5 years, regularly taking valsartan; type 2 diabetes mellitus for 3 years, regularly taking metformin; natural menopause for 2 years
  - Current medications: Valsartan 80mg qd, Metformin sustained-release tablets 0.5g bid, Letrozole 2.5mg qd
  - Lifestyle: Regular daily routine, but subjectively high work-related stress; due to postoperative fatigue and joint pain, basically no regular physical exercise.
  - Vital signs: blood_pressure=135/85 mmHg；heart_rate=78 bpm；temperature=36.6℃；respiratory_rate=18 次/分
  - Physical examination: Clear consciousness, in fair spirits. A ~15 cm horizontal (“one”-shaped) surgical scar is visible on the right chest wall; well healed, without redness, swelling, or exudate. Left breast symmetric; no definite masses or nodules palpated. No enlarged lymph nodes palpated in bilateral supraclavicular or axillary regions. Cardiopulmonary auscultation unremarkable. Abdomen soft and flat, no tenderness. No edema in bilateral lower extremities.
  - Ancillary tests: Recent (1 week ago) recheck results from the superior hospital attached to the referral form: Complete blood count: WBC 5.5×10^9/L, Hb 125g/L, PLT 210×10^9/L. Liver and kidney function: ALT 25 U/L, AST 28 U/L, Cr 68 μmol/L. Fasting blood glucose 6.8 mmol/L. Tumor markers: CA153 18.9 U/mL, CEA 2.1 ng/mL (both within normal range).
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
