case_id: chronic_disease_management/chronic_disease_management_038
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  Master Zhang, a 68-year-old patient with Parkinson’s disease, returns for follow-up due to “dizziness and fatigue after lunch for half a year.” His history is highly suggestive: symptoms occur every time after lunch, and he has had several near-falls, severely affecting his daytime activities. You strongly suspect postprandial hypotension (PPH).
  
  To clarify the diagnosis, you performed a standardized post-lunch blood pressure monitoring in the clinic. The results showed that at 60 minutes after the meal, his systolic blood pressure dropped from 135 mmHg pre-meal to 120 mmHg, with a maximal decline of 15 mmHg, after which blood pressure began to recover. This value does not meet the traditional diagnostic criteria for PPH.
  
  **Patient information:**
  - Name: Master Zhang, male, 68 years old, retired fitter
  - Chief complaint: Worsening dizziness and fatigue after lunch for half a year.
  - History of present illness: Over the past half year, the patient repeatedly reports that about 1 hour after lunch, he develops marked dizziness, transient visual dimming/blackouts, and generalized fatigue, with a sensation of leg weakness. He has had several episodes of nearly falling when standing up and moving around, but was supported in time by family members. The above symptoms can resolve spontaneously after lying down and resting for about 30–60 minutes. There are no similarly obvious symptoms after breakfast or dinner. The patient reports that to avoid attacks, he does not dare to move around freely after lunch.
  - Past medical history: Parkinson’s disease for 5 years, Hoehn–Yahr stage 2.5, on regular levodopa therapy; hypertension for 10 years, takes antihypertensive medication in the morning, blood pressure control is acceptable.
  - Current medications: Levodopa/benserazide tablets 125mg Tid; amlodipine besylate 5mg Qd (taken in the morning)
  - Lifestyle: Regular three meals daily; especially prefers a high-carbohydrate lunch such as rice and noodles.
  - Vital signs: blood_pressure=pre-visit resting seated blood pressure: 135/80 mmHg；heart_rate=72 bpm；other=temperature and respiration normal
  - Physical examination: Neurologic examination: masked facies, resting tremor of both hands (left worse), cogwheel rigidity in all limbs, unstable turning and gait initiation. Cardiopulmonary and abdominal examinations: no specific positive findings.
  - Ancillary tests: To assess his symptoms, you performed standardized post-lunch (approximately 600kcal, containing 75g carbohydrate) blood pressure monitoring in the clinic, with the following results:
  - Pre-meal: 135/80 mmHg
  - 30 min post-meal: 125/75 mmHg (systolic BP decreased by 10mmHg)
  - 60 min post-meal: 120/72 mmHg (systolic BP decreased by 15mmHg)
  - 90 min post-meal: 128/76 mmHg (systolic BP decreased by 7mmHg)
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
