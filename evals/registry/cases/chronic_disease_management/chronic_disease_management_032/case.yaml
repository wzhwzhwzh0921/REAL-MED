  **Case ID:`chronic_disease_management_032`chronic_disease_management_032`
  
  You are seeing Ms. Wang, a 48-year-old patient with bipolar II disorder. She is currently in a severe depressive episode, manifested by extreme psychomotor retardation and persistent suicidal ideation. Reviewing her treatment history, on the basis of maintenance mood stabilizer sodium valproate, she has failed multiple first-line antidepressant agents (quetiapine, lurasidone) as well as an augmentation strategy (lamotrigine), meeting the definition of treatment-resistant bipolar depression (TRBD).
  
  The patient’s husband is extremely anxious and earnestly asks you: “Doctor, we’ve tried so many medications and none have worked. She’s thinking about death all day, and our whole family is about to collapse. Is electroconvulsive therapy (ECT) the only option left? We’ve heard the side effects are significant, and we’re a bit scared, but if it can save her life, we’ll have to do it. Is there any other way to help her get better quickly?”
  
  Faced with this difficult clinical situation, the patient’s condition and suicide risk require that you must adopt rapid and effective interventions. ECT is undoubtedly a powerful option, but it is also a plan with significant invasiveness and cognitive side effects.
  
  **Patient information:**
  - Name: Ms. Wang, female, 48 years old, accountant
  - Chief complaint: Depressed mood for 4 months, worsening with suicidal thoughts for 1 month.
  - History of present illness: The patient developed depressed mood 4 months ago without an obvious trigger, with loss of interest, decreased energy, subjectively feeling “slower-minded,” and a severe decline in work efficiency, and therefore took leave and stayed at home. Over the past month, symptoms have worsened; she stays in bed all day, is unable to complete personal hygiene, has reduced speech output, and has repeatedly expressed to family members that “living is meaningless, I want to be relieved sooner.” Her husband reports that over the past 3 months, under your guidance, on the basis of sodium valproate, she has received adequate dose and adequate duration (>8 weeks) treatment with quetiapine (up to 400mg/d) and lurasidone (up to 80mg/d), and has also tried lamotrigine (gradually titrated to 200mg/d) augmentation therapy, but depressive symptoms have not improved significantly. Montgomery–Åsberg Depression Rating Scale (MADRS) score is 38 (severe depression).
  - Past medical history: 15-year history of bipolar II disorder, on long-term maintenance treatment but with recurrent depressive episodes. 5-year history of hypertension, well controlled with irbesartan. No history of substance abuse.
  - Current medications: Sodium valproate sustained-release tablets 1000mg/d
  - Lifestyle: Recently, due to depressed mood, has been neglecting daily life, with irregular diet; weight increased by 5 kg compared with 3 months ago.
  - Vital signs: blood_pressure=135/85 mmHg；heart_rate=78 bpm；respiratory_rate=18 breaths/min；temperature=36.7°C
  - Physical examination: Apathetic facial expression, passive during interview. No obvious abnormalities on cardiac, pulmonary, or abdominal examination. Neurological examination without positive signs.
  - Ancillary tests: Complete blood count, liver and renal function, thyroid function, and ECG are all within normal range. Valproate serum concentration is 75μg/mL (therapeutic range 50-125μg/mL).
  
