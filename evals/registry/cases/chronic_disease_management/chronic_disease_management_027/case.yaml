case_id: chronic_disease_management/chronic_disease_management_027
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  In the sleep medicine center clinic, you (a chronic disease management specialist) have just explained the polysomnography report to Mr. Wang Jianguo, a 48-year-old long-haul truck driver. “Mr. Wang, your results are definitive: ‘severe obstructive sleep apnea–hypopnea syndrome,’” you say, pointing to the AHI and the lowest oxygen saturation on the report. “This is not only the direct reason you feel sleepy during the day and why driving is dangerous, but it is also closely related to your poor blood pressure and blood glucose control.”
  
  You then explain in detail the necessity and effectiveness of continuous positive airway pressure (CPAP) therapy and prescribe a home noninvasive ventilator. After hearing this, Mr. Wang frowns, his face full of worry and confusion. Rubbing his hands, he asks anxiously, “Doctor, can I get used to sleeping with this mask? I heard it’s very uncomfortable. I’m on the road all year round—carrying this thing is a hassle, and how exactly do I use it? What if there’s air leak or I feel uncomfortable—what should I do?”
  
  Facing the patient’s concerns and unfamiliarity with the new therapy, you know that successful first-time use education is the key determinant of treatment success or failure. You decide to provide a clear framework to the respiratory therapist who will guide Mr. Wang on device use, ensuring that this critical “first lesson” can precisely and efficiently address his worries and help him take the first step in treatment smoothly.
  
  **Patient information:**
  - Name: Wang Jianguo, male, 48 years old, long-haul truck driver
  - Chief complaint: Snoring and nocturnal choking for more than 10 years, worsening with daytime sleepiness for 1 year.
  - History of present illness: The patient reports loud snoring at night for more than 10 years. His wife has repeatedly observed apnea episodes during sleep, each lasting from over ten seconds to dozens of seconds, followed by loud gasping and awakening due to choking. Over the past year, he has felt very prone to daytime sleepiness; self-rated Epworth Sleepiness Scale (ESS) score is 16. Especially during breaks while waiting for loading/unloading cargo, and even while driving when stopped at red lights, he becomes uncontrollably drowsy. Half a month ago, he nearly had a rear-end collision due to fatigued driving and therefore sought medical care. He also reports dry mouth and headache upon awakening, with decreased memory and attention.
  - Past medical history: Hypertension for 5 years; type 2 diabetes mellitus for 2 years
  - Current medications: Valsartan 80mg qd; Metformin 0.5g bid
  - Lifestyle: Smokes about 15 cigarettes per day; drinks baijiu with dinner, about 2–3 liang. Due to work, meals are irregular; prefers high-fat and high-salt foods; lacks regular exercise.
  - Vital signs: blood_pressure=145/95 mmHg；heart_rate=82 bpm；BMI=32.0 kg/m²
  - Physical examination: Height 175cm, weight 98kg. Neck circumference 44cm. Alert and oriented, in fair general condition. Narrow pharyngeal cavity; soft palate lax and low-hanging; uvula thickened; tonsils grade II enlargement. Mallampati class IV. No obvious abnormalities on cardiac, pulmonary, or abdominal examination.
  - Ancillary tests: Polysomnography (PSG): total sleep time 380 minutes; apnea–hypopnea index (AHI) 45.6 events/hour; longest apnea 72 seconds; mean oxygen saturation 91%; lowest oxygen saturation (LSaO2) 78%. Laboratory tests: fasting blood glucose 7.5 mmol/L; glycated hemoglobin 7.8%.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
