case_id: chronic_disease_management/chronic_disease_management_007
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  A 60-year-old Mr. Wang is a patient with chronic coronary syndrome. Two years ago, he underwent PCI for myocardial infarction and has been consistently taking medications such as atorvastatin 20 mg since the procedure. Today, he comes to your outpatient clinic with his latest laboratory report for follow-up. He appears in very good spirits and reports no discomfort.
  
  In the medical record system, you find that his baseline LDL-C two years ago, when he was not taking lipid-lowering medication, was 2.6 mmol/L. Today’s laboratory report shows his current LDL-C is 1.7 mmol/L, with normal liver and kidney function and normal creatine kinase. Seeing few abnormal arrows on the report, Mr. Wang asks with concern: “Doctor, how is my lipid control? The numbers seem okay—can I just keep taking the medicine the same way?”
  
  **Patient information:**
  - Name: Wang Jianguo, male, 60 years old, retired middle-school teacher
  - Chief complaint: Routine follow-up; no chest tightness, chest pain, or other discomfort.
  - History of present illness: The patient recovered well after PCI 2 years ago, has been taking medications regularly, and attending scheduled outpatient follow-ups. This visit is an annual review. The patient reports no precordial discomfort and stable exercise tolerance. The medical record system shows that before PCI 2 years ago, his baseline low-density lipoprotein cholesterol (LDL-C) without medication was 2.6 mmol/L. He presents today with the latest lab report.
  - Past medical history: Chronic coronary syndrome (CCS) diagnosed 2 years ago; 2 years ago underwent implantation of 1 drug-eluting stent (PCI) in the mid left anterior descending artery for “acute non-ST-segment elevation myocardial infarction”; hypertension for 5 years with good blood pressure control; no diabetes; no smoking history
  - Current medications: Atorvastatin 20mg once nightly, Aspirin 100mg once daily, Metoprolol sustained-release 47.5mg once daily, Valsartan 80mg once daily
  - Lifestyle: Regular routine; adheres to a light diet per medical advice, but has low daily exercise due to knee discomfort.
  - Vital signs: blood_pressure=128/76 mmHg；heart_rate=62 bpm；respiratory_rate=18 次/分；temperature=36.5℃
  - Physical examination: Clear consciousness, cooperative during examination. No abnormalities on cardiac and pulmonary auscultation; no edema in both lower extremities.
  - Ancillary tests: Lipid profile today: total cholesterol 3.9 mmol/L, low-density lipoprotein cholesterol (LDL-C) 1.7 mmol/L, high-density lipoprotein cholesterol 1.1 mmol/L, triglycerides 1.5 mmol/L. Liver function (ALT, AST) and creatine kinase (CK) are within normal range.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
