case_id: chronic_disease_management/chronic_disease_management_016
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  In the chronic disease management clinic of a community health service center, as Wang Jianguo’s responsible physician, you are explaining the results of his annual follow-up. “Master Wang, the good news is that your visual acuity is still 1.0 this year—excellent. However, the new fundus photograph we took shows a small early issue.” You hand him the fundus color photo report and point to the diagnostic conclusion: “The report indicates ‘mild non-proliferative diabetic retinopathy.’ This is the earliest vascular change in the retina caused by diabetes—like an early warning signal.”
  
  Master Wang takes the report, glances at it, and casually puts it aside with a smile: “Doctor, look—my vision is 1.0, very good. When I drive, I can read road signs even more clearly than those young guys in my fleet in their twenties. It says ‘mild’ on the report, and it doesn’t hurt or itch—so it should be fine, right?”
  
  You continue explaining: “Precisely because it’s early, you don’t feel anything. But guidelines recommend that even mild disease should have a fundus re-examination once a year.” Master Wang frowns, waves his hand, and says: “Every year? That’s too much trouble. I run long-haul routes year-round, and it’s hard to make time. Besides, since I can see so clearly now, can’t I just come to check when I feel eye discomfort? I don’t think it’s necessary to go through the hassle every year for a problem that I ‘can’t feel.’”
  
  **Patient information:**
  - Name: Wang Jianguo, male, 52 years old, long-haul truck driver
  - Chief complaint: Annual routine physical examination and chronic disease follow-up
  - History of present illness: The patient is a community-managed type 2 diabetes patient and is attending today’s scheduled annual follow-up. Over the past year, he reports no eye discomfort, no blurred vision, floaters, or dark shadows in the visual field. He emphasizes that his “eyesight is very good—no problem reading road signs while driving at night.” This follow-up is his first time undergoing the community’s newly introduced non-mydriatic fundus photography screening.
  - Past medical history: Type 2 diabetes for 8 years, hypertension for 5 years, taking medications regularly; hyperlipidemia for 3 years; he reports “sometimes forgetting to take medications.”
  - Current medications: Metformin 1g bid, glimepiride 2mg qd, amlodipine besylate 5mg qd, atorvastatin calcium tablets 10mg qn (poor adherence)
  - Lifestyle: His job requires prolonged sitting and driving; meals are irregular and he often relies on fast food. Smokes about 10 cigarettes per day. Due to work, he can only manage a small amount of activity on weekends. He considers himself energetic and believes there are “no major problems” with his health.
  - Vital signs: blood_pressure=138/86 mmHg；heart_rate=76 bpm；BMI=28.7 kg/m²
  - Physical examination: Uncorrected visual acuity is 1.0 in both eyes. No abnormality on cardiac and pulmonary auscultation. Dorsalis pedis pulses are palpable bilaterally. The 10g monofilament test suggests mild reduction of protective sensation at both great toes and first metatarsal heads.
  - Ancillary tests: Hemoglobin A1c (HbA1c): 7.8%. Fasting plasma glucose: 8.2 mmol/L. Total cholesterol: 5.6 mmol/L, low-density lipoprotein cholesterol (LDL-C): 3.4 mmol/L. Fundus photography report: scattered microaneurysms in both eyes; no cotton-wool spots, hard exudates, or neovascularization; macular morphology normal. Imaging diagnosis: mild non-proliferative diabetic retinopathy (Mild NPDR) in both eyes.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
