case_id: chronic_disease_management/chronic_disease_management_025
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  Master Wang, 68 years old, presents for follow-up due to “chronic wheezing and worsening shortness of breath after activity for the past six months.” He has a 40-year smoking history and was diagnosed with COPD 8 years ago. He is currently using tiotropium/olodaterol (LAMA/LABA) dual bronchodilator therapy regularly every day. Despite this, he still finds daily activities (such as climbing to the second floor or brisk walking) very difficult, and his self-reported CAT score today is 22.
  
  Master Wang recalls that over the past year, he had two episodes of sudden worsening cough, sputum production, and wheezing, and had to visit the community health service center; symptoms improved only after taking oral corticosteroids for a few days. Physical examination shows mildly increased work of breathing, with a small amount of wheezing audible in both lungs. Recent spirometry shows FEV1 at 45% of predicted (GOLD grade 3), and a complete blood count shows an eosinophil count of 250 cells/μL.
  
  After your assessment, you confirm that he is currently in a stable phase, but meets the GOLD group D criteria (high symptom burden, high risk of acute exacerbations). The current treatment regimen is insufficient to control his condition, and pharmacologic therapy needs to be escalated.
  
  **Patient information:**
  - Name: Wang Jianguo, male, 68 years old, retired fitter
  - Chief complaint: Recurrent wheezing and worsening shortness of breath after activity for the past six months.
  - History of present illness: The patient is in a stable phase of COPD and is attending routine outpatient follow-up. He reports that despite regular daily use of a LAMA/LABA dual inhaler, his symptoms have continued to worsen over the past six months; he develops obvious shortness of breath after climbing to the second floor or briskly walking 100 meters. His self-completed COPD Assessment Test (CAT) score today is 22. On detailed questioning, the patient confirms that within the past 12 months, he had two acute exacerbations with cough, sputum, and wheezing; a community physician prescribed oral prednisone for 5 days, after which symptoms improved.
  - Past medical history: Chronic obstructive pulmonary disease (COPD) for 8 years; hypertension for 10 years, well controlled
  - Current medications: Tiotropium/olodaterol inhalation spray (LAMA/LABA) once daily
  - Lifestyle: 40-year smoking history (about 20 cigarettes/day), quit smoking 5 years ago.
  - Vital signs: blood_pressure=135/85 mmHg；heart_rate=88 bpm；respiratory_rate=22 次/分；spo2=93%（室内空气）
  - Physical examination: Alert and oriented, no cyanosis of the lips. Barrel chest, decreased breath sounds in both lungs, prolonged expiratory phase, with scattered wheezes audible. Heart rate 88/min, regular rhythm. No edema in both lower extremities.
  - Ancillary tests: Recent repeat pulmonary function test: post-bronchodilator FEV1/FVC 58%, FEV1 45% of predicted. Complete blood count: normal white blood cell count, blood eosinophil count 250个/μL.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
