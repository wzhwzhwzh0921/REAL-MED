  **Case ID:`chronic_disease_management_029`chronic_disease_management_029`
  
  **Clinical scenario:**
  Master Wang, a 68-year-old retired carpenter, has had COPD for 10 years. Although he has already quit smoking and has been strictly using triple inhalation therapy with salmeterol/fluticasone combined with tiotropium as prescribed, over the past year he still experienced 3 acute exacerbations, one of which was severe enough to require hospitalization. This has left him feeling very frustrated.
  
  At today’s follow-up visit, Master Wang proactively asks you: “Doctor, I heard there’s an ‘anti-inflammatory medicine,’ like azithromycin, that can be taken long-term to prevent COPD flare-ups. Is my situation suitable for it? If I take it, besides stomach irritation, is there anything in particular I need to watch out for?”
  
  After evaluation, you believe Master Wang is indeed an appropriate candidate for long-term macrolide therapy to prevent acute exacerbations, and you are preparing to discuss this treatment plan with him.
  
  **Patient information:**
  - Name: Master Wang, male, 68 years old, retired carpenter
  - Chief complaint: Follow-up visit seeking better ways to control acute exacerbations.
  - History of present illness: Over the past year, despite adherence to triple inhaled therapy, the patient still visited the emergency department 3 times due to worsened dyspnea and increased purulent sputum, including 1 episode requiring hospitalization. Currently in a stable phase, with decreased exercise tolerance. He has heard there is an “anti-inflammatory medicine” that can be taken long-term to prevent exacerbations and proactively consults you about the feasibility of this option and precautions.
  - Past medical history: Chronic obstructive pulmonary disease (GOLD group D) for 10 years; hypertension for 5 years, taking medications regularly; no clear history of arrhythmia, no complaint of hearing loss
  - Current medications: Salmeterol/fluticasone inhalation powder (50/500µg) twice daily; tiotropium bromide dry powder inhaler once daily
  - Lifestyle: 40 pack-year smoking history; quit smoking 3 years ago.
  - Vital signs: blood_pressure=135/85 mmHg；heart_rate=78 bpm；respiratory_rate=18 次/分；spo2=94%（at rest, room air）
  - Physical examination: Alert, no cyanosis of the lips. Decreased breath sounds bilaterally, prolonged expiratory phase, with scattered dry rales. Regular heart rhythm, no pathological murmurs. No edema in both lower extremities.
  - Ancillary tests: ECG: sinus rhythm, QTc interval 430ms (normal). CBC: WBC 7.5x10^9/L, EOS 150 cells/μL. Liver and renal function normal.
  
