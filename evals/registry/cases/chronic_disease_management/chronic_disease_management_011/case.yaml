case_id: chronic_disease_management/chronic_disease_management_011
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  In the chronic disease management clinic of a community health service center, you meet your long-term patient, Mr. Zhang (Teacher Zhang). He is a retired teacher with a 15-year history of type 2 diabetes. His blood pressure and blood glucose have generally been controlled reasonably well, but over the past month he has become very worried because both legs are “swollen like steamed buns,” along with persistent fatigue.
  
  While reassuring him, you pull up his latest test reports. Several red flagged values on the screen make you frown: blood pressure 152/95 mmHg, far from target; and HbA1c has also risen to 8.6%. More importantly, the kidney-related indices: serum creatinine 168 μmol/L, calculated eGFR only 38 ml·min⁻¹·(1.73 m²)⁻¹, and random UACR as high as 1150 mg/g. At the same time, you note that he already had a clearly documented diabetic retinopathy record 5 years ago, and this urinalysis microscopy is “clean,” with no evidence of active glomerulonephritis such as hematuria or cellular casts.
  
  Seeing your serious expression, Mr. Zhang asks nervously: “Doctor, is my kidney going to fail? I heard from my neighbor that in this situation you need a ‘kidney biopsy’ to figure it out—is that true? I’m a bit scared.”
  
  **Patient information:**
  - Name: Zhang Jianguo, male, 62 years old, retired middle school teacher
  - Chief complaint: Bilateral lower-extremity edema for 1 month, with worsening fatigue.
  - History of present illness: The patient is a long-term patient in community outpatient chronic-disease management. One month ago, without an obvious trigger, he developed edema of both feet and ankles, relieved in the morning after waking and worse in the afternoon, accompanied by easy fatigability and poor energy. He did not self-medicate. Today he returns for a scheduled follow-up visit, hoping the doctor will assess his condition.
  - Past medical history: Type 2 diabetes for 15 years; hypertension for 10 years; fundus examination 5 years ago showed “background diabetic retinopathy”
  - Current medications: Metformin 1g, twice daily; Valsartan 80mg, once daily; Atorvastatin 20mg, once nightly
  - Lifestyle: Reduced activity after retirement; reports poor dietary control and preference for wheat-based foods. Non-smoker, no alcohol use history.
  - Vital signs: blood_pressure=152/95 mmHg；heart_rate=80 bpm；respiratory_rate=18 breaths/min；temperature=36.7°C
  - Physical examination: Alert and oriented, answers questions appropriately. No obvious abnormalities on cardiac and pulmonary auscultation. Abdomen soft, no tenderness. Bilateral lower extremities with pitting edema (++), skin intact without ulceration.
  - Ancillary tests: Complete blood count: HGB 108 g/L;
  Biochemistry: SCr 168 μmol/L, blood urea nitrogen 11.2 mmol/L;
  HbA1c: 8.6%;
  Random urine albumin/creatinine ratio (UACR): 1150 mg/g;
  Urinalysis: urine protein (+++), RBC (-), WBC (-), no casts seen;
  eGFR calculated by CKD-EPI formula: 38 ml·min⁻¹·(1.73 m²)⁻¹.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
