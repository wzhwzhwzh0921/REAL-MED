case_id: chronic_disease_management/chronic_disease_management_024
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  Ms. Zhou, a 68-year-old woman, was admitted for progressive abdominal distension for more than 1 month. After a comprehensive evaluation, she was diagnosed with “high-grade serous ovarian carcinoma, FIGO stage IIIC.” The patient has a baseline of mild diabetic peripheral neuropathy, but her general condition is still acceptable (ECOG score 1). After MDT discussion, considering the heavy tumor burden, it was decided to administer 3 cycles of neoadjuvant chemotherapy first, and then perform interval debulking surgery (IDS) after tumor shrinkage and improvement in the patient’s overall condition. The first-line chemotherapy regimen was determined to be a 3-weekly “taxane + carboplatin” regimen.
  
  **Patient information:**
  - Name: Ms. Zhou, female, 68 years old, retired teacher
  - Chief complaint: Progressive abdominal distension with poor appetite for more than 1 month
  - History of present illness: The patient developed abdominal distension without an obvious trigger more than 1 month ago, worse after meals, accompanied by decreased appetite, early satiety, and fatigue. She visited an outside hospital without a definitive diagnosis; symptoms continued to worsen. Today she came to our hospital for further evaluation and treatment.
  - Past medical history: Type 2 diabetes mellitus for 10 years, long-term oral metformin with fair glycemic control. Over the past half year she has had numbness and tingling in both feet; neurology diagnosed “diabetic peripheral neuropathy” (NCI-CTCAE grade 1).
  - Current medications: Metformin hydrochloride tablets 0.5g tid
  - Lifestyle: No tobacco or alcohol use; regular lifestyle.
  - Vital signs: blood_pressure=135/85 mmHg；heart_rate=82 bpm；respiratory_rate=18 breaths/min；temperature=36.7°C；performance_status=ECOG 1分
  - Physical examination: General condition acceptable, alert and oriented. Abdomen distended; shifting dullness positive on percussion. Gynecologic exam: cervix smooth; uterus normal size with poor mobility. Irregular, fixed masses palpable in bilateral adnexal regions with unclear borders, diameter about 10cm, with tenderness.
  - Ancillary tests: CBC and liver/kidney function without obvious abnormalities. Serum CA125: 1560 U/mL. Contrast-enhanced CT of the abdomen and pelvis: irregular solid masses in both ovaries, suspicious for malignancy; “omental cake” thickening; massive ascites in the abdomen and pelvis. Ascitic fluid cytology: adenocarcinoma cells identified; combined with immunohistochemistry (PAX8+, WT-1+, p53 mutant pattern), consistent with high-grade serous carcinoma. Clinical stage: FIGO stage IIIC.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
