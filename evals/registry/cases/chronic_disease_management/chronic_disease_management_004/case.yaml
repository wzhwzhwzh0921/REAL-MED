case_id: chronic_disease_management/chronic_disease_management_004
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  A 68-year-old retired teacher, Mr. Wang, returns to your outpatient clinic for follow-up 3 months after a “transient ischemic attack (TIA).” He has been strictly taking valsartan, aspirin, and a statin according to the discharge instructions. He feels well and has no discomfort. He happily tells you that he takes a walk every day and has completely quit smoking.
  
  You measure his blood pressure as 136/88 mmHg, with a heart rate of 72 bpm. Neurologic examination reveals no positive findings. After seeing the blood pressure reading, Mr. Wang says: “Doctor, my blood pressure control looks pretty good, right? It’s much better than when it used to be higher, and I don’t feel any discomfort. Should I just keep taking the medications like this?”
  
  **Patient information:**
  - Name: Wang Jianguo, male, 68 years old, retired teacher
  - Chief complaint: Outpatient follow-up visit; no special discomfort.
  - History of present illness: The patient presented 3 months ago for “sudden right-sided limb weakness with slurred speech,” lasting about 30 minutes and then completely resolving spontaneously. Brain MRI-DWI showed no acute infarct lesions, and he was diagnosed with “transient ischemic attack.” After discharge, he has been taking medications regularly as instructed and reports no dizziness, headache, chest tightness, palpitations, or other discomfort. Today he returns as scheduled to the stroke prevention clinic for follow-up.
  - Past medical history: History of transient ischemic attack (TIA) for 3 months; hypertension for 5 years; dyslipidemia
  - Current medications: Valsartan 80mg once daily, Atorvastatin 20mg once nightly, Aspirin 100mg once daily
  - Lifestyle: Has quit smoking; occasionally drinks small amounts of alcohol when gathering with friends. Takes a daily 30–40-minute walk in the park, but he feels his diet is salty and his family uses quite a lot of salt when cooking.
  - Vital signs: blood_pressure=136/88 mmHg；heart_rate=72 bpm；respiratory_rate=18 breaths/min；temperature=36.6℃
  - Physical examination: Alert and clear-minded; speech fluent; answers questions appropriately. Heart, lung, and abdominal examinations unremarkable. Neurologic exam: cranial nerves symmetric bilaterally; limb muscle strength grade V; normal muscle tone; symmetric sensation; bilateral pathological reflexes negative.
  - Ancillary tests: Recent lipid panel recheck: total cholesterol 4.2 mmol/L, triglycerides 1.8 mmol/L, LDL-C 2.1 mmol/L. Liver and kidney function and electrolytes are all within normal ranges.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
