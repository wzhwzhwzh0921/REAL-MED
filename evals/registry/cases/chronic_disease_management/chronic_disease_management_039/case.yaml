  **Case ID:`chronic_disease_management_039`chronic_disease_management_039`
  
  A 68-year-old retired university professor, Mr. Qian, has had a confirmed diagnosis of Parkinson’s disease for 5 years. With regular use of a compound levodopa preparation, his motor symptoms such as tremor and rigidity have been controlled quite well. However, over the past year, his wife has brought him back to your clinic with a worried expression. She reports that Professor Qian’s memory has been getting worse—especially that he forgets what was just said or what he just did—and that he frequently has word-finding difficulty even in familiar conversations. She feels that the rate of decline in his cognitive function seems faster than that of several other Parkinson’s disease patients she knows.
  
  You assessed Professor Qian: his MoCA score was 22, confirming mild cognitive impairment. The brain MRI report only noted mild cerebral atrophy and a small amount of leukoaraiosis consistent with age. At present, the patient’s motor symptoms are stable, Hoehn and Yahr stage 2.5.
  
  **Patient information:**
  - Name: Professor Qian, male, 68 years old, retired university professor
  - Chief complaint: Progressive memory decline and slowed responses for 1 year.
  - History of present illness: The patient was diagnosed with Parkinson’s disease 5 years ago. After long-term use of levodopa, motor symptoms (tremor, rigidity) have been stably controlled. Over the past 1 year, his wife has noticed a marked worsening of his memory, especially difficulty recalling events from yesterday or a few hours ago (prominent impairment in recent-event memory), and he often repeatedly asks the same question. At the same time, he has developed obvious word-finding difficulty during conversations—“the words are on the tip of his tongue but he can’t say them.” The pace of cognitive decline worries the family, who feel it is “much faster than Old Li next door who also has Parkinson’s disease.” The patient’s mood is fair, with no obvious depression, anxiety, or visual hallucinations.
  - Past medical history: Parkinson’s disease for 5 years; hypertension for 10 years, with good blood pressure control
  - Current medications: Compound levodopa tablets 125mg, three times daily; valsartan 80mg, once daily
  - Lifestyle: Prior to retirement he had a regular routine and loved reading and writing. Over the past year, due to memory decline, he has significantly reduced social activities and reading.
  - Vital signs: blood_pressure=132/78 mmHg；heart_rate=72 bpm；respiratory_rate=16次/分；temperature=36.5℃
  - Physical examination: Neurologic exam: alert and conscious; decreased speech fluency with word-finding difficulty. Orientation and calculation are intact. Mild “pill-rolling” resting tremor in both upper limbs; cogwheel rigidity. Gait with small shuffling steps; slightly unsteady on turning. H-Y stage 2.5. Pull test positive; able to recover independently.
  - Ancillary tests: Brain MRI: mild cerebral atrophy; small amount of subcortical leukoaraiosis; no definite infarction or space-occupying lesion. Montreal Cognitive Assessment (MoCA) score: 22 (years of education >12 years).
  
