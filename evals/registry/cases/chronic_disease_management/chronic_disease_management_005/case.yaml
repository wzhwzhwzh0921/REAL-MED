case_id: chronic_disease_management/chronic_disease_management_005
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  In the heart failure specialty clinic, as the senior attending physician supervising, you are seeing Teacher Wang together with your visiting trainee Dr. Li. You quickly review Teacher Wang’s chart and note that he is currently receiving the “golden triangle” regimen based on the 2018 guideline, and the doses are close to target; his heart rate is also well controlled. However, his symptoms have clearly worsened recently, his NT-proBNP level has nearly doubled, and LVEF has also decreased slightly, suggesting the disease is still progressing.
  
  After reviewing the data, Dr. Li thinks aloud: “Teacher Wang’s blood pressure is 115/75mmHg and heart rate is 65 bpm; there isn’t much room to further up-titrate metoprolol and valsartan. Furosemide may need to be increased to control volume overload. Alternatively, we could consider switching valsartan to sacubitril/valsartan, but I’m not sure whether his blood pressure would tolerate it.”
  
  You nod, affirming Dr. Li’s reasoning, but decide to use this as an opportunity to assess his understanding of the latest guidelines. You close the chart, turn to Dr. Li, and ask: “Dr. Li, your thinking is very good—you’ve indeed touched on several key issues. But let’s think: according to the ‘Chinese Guidelines for the Diagnosis and Treatment of Heart Failure 2024’ that we just studied, for a patient like Teacher Wang, what fundamental shift should occur in our overall treatment strategy? This is not merely a matter of switching one drug or adding one drug.”
  
  **Patient information:**
  - Name: Wang Jianguo, male, 68 years old, retired teacher
  - Chief complaint: Worsening exertional dyspnea for more than 1 month.
  - History of present illness: The patient was diagnosed with HFrEF 1.5 years ago, LVEF 35%. After standardized pharmacologic therapy (the “golden triangle” regimen at that time: valsartan, metoprolol, spironolactone), symptoms remained stable for nearly 1 year. Over the past month, the patient has perceived a marked decline in exercise tolerance compared with before: previously, a 30-minute walk caused only mild fatigue, but now walking for 15 minutes leads to obvious shortness of breath, requiring rest for relief. Occasional orthopnea at night; needs to sleep propped up on two pillows. No chest pain or palpitations; denies fever or cough. Self-monitored weight increased by 2 kg over the past month. He presents for follow-up for further evaluation and management.
  - Past medical history: 15-year history of hypertension with reasonably controlled blood pressure; 10-year history of type 2 diabetes mellitus; underwent PCI 2 years ago for acute anterior wall myocardial infarction (one stent placed in the LAD); diagnosed 1.5 years ago with “chronic heart failure (HFrEF)” due to “exertional dyspnea and bilateral lower-extremity edema.”
  - Current medications: Metoprolol succinate sustained-release tablets 95mg qd, valsartan capsules 80mg bid, spironolactone tablets 20mg qd, furosemide tablets 20mg qd, aspirin enteric-coated tablets 100mg qd, atorvastatin calcium tablets 20mg qn, metformin tablets 0.5g tid
  - Lifestyle: Reports following a low-salt diet as instructed, but sometimes finds it difficult to adhere to. No tobacco or alcohol use. Walks for 30 minutes daily, but has felt unable to keep up over the past month.
  - Vital signs: blood_pressure=115/75 mmHg (sitting, right arm)；heart_rate=65 bpm (regular rhythm)；respiratory_rate=20 次/分；temperature=36.6℃；spo2=96% (room air)
  - Physical examination: Alert, in fair general condition. No jugular venous distention. A small amount of moist rales heard at both lung bases. Cardiac border enlarged to the left and downward; heart rate 65 beats/min, regular rhythm; no definite pathological murmurs in any valvular auscultation area. Abdomen soft, non-tender; liver and spleen not palpable. Mild pitting edema of both lower extremities (+).
  - Ancillary tests: CBC: normal. Biochemistry: K+ 4.2 mmol/L, Na+ 138 mmol/L, eGFR 65 mL/min/1.73m². NT-proBNP: 1850 pg/mL (980 pg/mL three months ago). Glycated hemoglobin (HbA1c): 7.2%. Recent repeat echocardiography shows: LV end-diastolic diameter 62mm, LVEF 33%, left atrial enlargement.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
