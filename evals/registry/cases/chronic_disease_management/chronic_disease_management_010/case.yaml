case_id: chronic_disease_management/chronic_disease_management_010
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  On a busy Tuesday afternoon in the stroke rehabilitation clinic, 55-year-old Mr. Wang comes for a follow-up visit accompanied by his wife. He appears in good spirits and says in a loud voice, “Doctor, I feel like I’ve almost recovered; it’s just that my right hand still doesn’t feel quite right. Do you think I can reduce my medications a bit? Taking pills every day is such a hassle.”
  
  As you review his medical record from his hospitalization three months ago for a “left basal ganglia intracerebral hemorrhage,” you observe him. He is somewhat overweight with a slightly flushed complexion. His wife adds anxiously, “Doctor, he talks like he’s fine, but he still drinks alcohol in secret. We bought him a blood pressure monitor, but he used it a few times and then stopped because he found it troublesome. I saw him measure it once a couple of days ago—it was already 150. Our whole family is very worried he’ll have another event.”
  
  You measure Mr. Wang’s blood pressure and obtain 148/92 mmHg, which clearly does not meet the ideal control target. Considering his obese build (BMI 28.5 kg/m²), unhealthy lifestyle habits, and unstable blood pressure, you realize that before initiating a formal secondary prevention program, you must first conduct a comprehensive review and assessment of his risk of recurrence.
  
  **Patient information:**
  - Name: Wang Jianguo, male, 55 years old, restaurant owner
  - Chief complaint: Follow-up visit 3 months after intracerebral hemorrhage surgery, requesting adjustment of the subsequent treatment plan.
  - History of present illness: The patient was hospitalized 3 months ago for hypertensive intracerebral hemorrhage. Residual deficits include mild right-sided limb weakness (muscle strength 4+ out of 5) and slight mouth corner deviation. He is currently largely independent in daily life and has returned to work to handle some light duties. The patient reports, “I feel I’ve recovered quite well,” but family members report he still drinks alcohol and that his self-measured blood pressure fluctuates significantly, sometimes as high as 150/95 mmHg. He presents today to the stroke specialty clinic for follow-up, hoping to clarify how to manage going forward to prevent recurrence.
  - Past medical history: History of hypertension for 10 years, with a maximum blood pressure of 180/110 mmHg; usually does not monitor regularly and stops antihypertensive medications on his own when he feels no discomfort. Three months ago, due to “sudden right-sided limb weakness and slurred speech,” he was diagnosed with “hypertensive intracerebral hemorrhage in the left basal ganglia region (approximately 25 ml)” and was discharged after conservative medical management. History of type 2 diabetes mellitus for 3 years, treated with oral metformin, with fairly good glycemic control. History of hyperlipidemia for 5 years, not taking medication regularly.
  - Current medications: Amlodipine besylate 5mg qd, Irbesartan 150mg qd, Metformin extended-release tablets 0.5g bid
  - Lifestyle: Smoked for more than 20 years, about 1 pack/day; quit smoking for 3 months. Long-term alcohol use, especially strong liquor in the evening, about 2–3 liang/day; reduced after the event but has not completely abstained. Due to work, diet is irregular; prefers high-salt and high-fat foods.
  - Vital signs: blood_pressure=148/92 mmHg (right upper arm, sitting); heart_rate=82 bpm; respiratory_rate=18 breaths/min; temperature=36.6℃; bmi=28.5 kg/m²
  - Physical examination: Alert and oriented; fluent speech. Weight 82kg, height 170cm. Right nasolabial fold slightly shallow; tongue protrusion midline. Neck supple, no resistance. Lungs clear to auscultation bilaterally. Heart rate 82/min, regular rhythm; no murmurs auscultated over valve areas. Abdomen distended, no tenderness. Right limb muscle strength 4+ out of 5 with normal tone; left limb muscle strength 5 out of 5. Bilateral pathological reflexes negative.
  - Ancillary tests: Recheck at discharge: total cholesterol 5.8 mmol/L, low-density lipoprotein cholesterol (LDL-C) 3.5 mmol/L, glycated hemoglobin (HbA1c) 6.8%. No repeat testing at this outpatient visit.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
