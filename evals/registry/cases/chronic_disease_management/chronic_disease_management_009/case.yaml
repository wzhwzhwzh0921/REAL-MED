case_id: chronic_disease_management/chronic_disease_management_009
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  In the endocrinology clinic, you are seeing Mr. Wang Jianguo and his wife for a follow-up visit. Mr. Wang looks well and happily hands you his glucose logbook, pointing to several nice numbers: “Doctor, look—my control has been pretty good this month, right? My last HbA1c was down to 6.8%, better than many younger people!”
  
  However, his wife interrupts anxiously: “What’s good about it! Something almost happened last week! If I hadn’t noticed early, he wouldn’t even have responded!” She describes in detail that frightening episode of asymptomatic hypoglycemia. While you calm the family, you pull up the CGM tracings from the two weeks Mr. Wang has been wearing it. On the screen, the sharply fluctuating curve is striking—although the mean glucose and HbA1c look ideal, the red hypoglycemia zones appear frequently, especially overnight and several hours after meals. There were multiple episodes of severe hypoglycemia below 3.0 mmol/L, and Mr. Wang himself was completely unaware.
  
  Pointing to the CGM graph, you tell Mr. Wang: “Mr. Wang, this ‘good result’ of HbA1c 6.8% comes at too high a cost. What we want is not a pretty number, but safety and stability. Right now it’s like driving on the highway to chase speed, but repeatedly slamming on the brakes and nearly rolling over—very dangerous.” Mr. Wang looks at the graph and falls silent in thought. At this moment, setting a safer, more individualized management target for him is the top priority.
  
  **Patient information:**
  - Name: Wang Jianguo, male, 72 years old, retired middle-school teacher
  - Chief complaint: Routine follow-up; assessment of recent glycemic control.
  - History of present illness: The patient presents for his routine follow-up visit every 3 months. He proudly reports that by strictly controlling his diet, several recent self-monitored fasting and postprandial glucose values “have been pretty good,” and his last HbA1c was also “at target.” However, his spouse adds that last Tuesday, about 2 hours after dinner, she found him sitting alone on the sofa staring blankly, with sluggish responses when spoken to, cold sweaty palms, but he did not feel any palpitations, hunger, or other discomfort. She immediately checked a fingerstick glucose, which read “Lo” (below the measurement limit). After giving him fruit juice, about 15 minutes later his consciousness cleared, but he had a vague memory of what had happened. The patient admits that similar “blackout” episodes have occasionally occurred in recent years, but blood glucose was not checked previously. To clarify recent glucose variability, he wore a continuous glucose monitoring (CGM) system for the past two weeks per medical advice.
  - Past medical history: Type 1 diabetes mellitus for 30 years; diagnosed with “hypoglycemia unawareness” for 5 years, with several episodes of confusion discovered by family and relieved after giving sugar water; hypertension for 10 years; mild nonproliferative diabetic retinopathy (NPDR); diabetic kidney disease stage 2 (microalbuminuria)
  - Current medications: Insulin degludec 16U QN; insulin aspart 4-6U TID before meals; valsartan 80mg QD; atorvastatin calcium 20mg QN
  - Lifestyle: Lives with spouse, who assists with dietary management. Regular meals, but sometimes reduces staple carbohydrate intake to pursue “good glucose.” Walks 30-45 minutes daily. Does not smoke; does not drink alcohol.
  - Vital signs: blood_pressure=132/78 mmHg；heart_rate=76 bpm；respiratory_rate=18 breaths/min；temperature=36.6℃；bmi=22.5 kg/m²
  - Physical examination: Alert and oriented, answers questions appropriately. On bilateral lower extremities, 10 g monofilament testing shows reduced protective sensation at the great toe and the first and fifth metatarsal heads on both feet. Bilateral ankle reflexes are absent.
  - Ancillary tests: Tests within the past 3 months: HbA1c 6.8%. CGM report from the 14 days prior to this visit: mean glucose 8.2 mmol/L; time in range (TIR, 3.9-10.0 mmol/L) 62%; time below range (TBR, <3.9 mmol/L) 7% (including <3.0 mmol/L time 2%); time above range (TAR, >10.0 mmol/L) 31%. Renal function: eGFR 68 mL/min/1.73m², urine albumin/creatinine ratio (UACR) 45 mg/g.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
