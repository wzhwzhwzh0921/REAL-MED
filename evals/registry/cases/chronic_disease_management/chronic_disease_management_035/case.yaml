case_id: chronic_disease_management/chronic_disease_management_035
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  Today is discharge day for Xiao Lin, a first-year high school student. After one week of evaluation and initial treatment, his condition has stabilized following his first generalized tonic-clonic seizure due to “juvenile myoclonic epilepsy.” In the ward, as his attending physician, you are conducting the final pre-discharge conversation. Xiao Lin is wearing his school uniform and looks somewhat quiet; he is relieved to be able to return to campus, yet uneasy and confused about the new label of “epilepsy.” His parents sit nearby, their faces full of worry and anxiety.
  
  You again explain the diagnosis and treatment plan: “Xiao Lin’s diagnosis is juvenile myoclonic epilepsy; the EEG findings are very typical. We have already started sodium valproate, which is a very effective medication. With standardized treatment, the vast majority of children can achieve very good seizure control.” You notice that when words like “staying up late” and “playing games” are mentioned, Xiao Lin’s gaze subconsciously avoids eye contact. His mother frowns and asks first: “Doctor, what exactly should we pay attention to after we go home? Can he still live normally like his classmates? He loves gaming so much—can he still play in the future? Will this illness affect his ability to get into university?”
  
  Facing the parents’ rapid-fire questions and Xiao Lin’s subtle resistance, you realize that a simple, rigid list of “precautions” is far from enough. You need to tailor an individualized self-management education plan for this special adolescent patient—one that he can understand, accept, and be willing to follow—because this is crucial to his long-term prognosis.
  
  **Patient information:**
  - Name: Xiao Lin, male, 16 years old, first-year high school student
  - Chief complaint: Sudden loss of consciousness with limb convulsions for 2 minutes
  - History of present illness: One week ago in the early morning while washing up, the patient suddenly lost consciousness, fell to the ground, had upward deviation of both eyes, trismus, frothing at the mouth, and tonic then clonic convulsions of all four limbs; the episode lasted about 2 minutes and resolved spontaneously. After recovery, he experienced generalized muscle soreness, headache, and fatigue. No urinary or fecal incontinence. This was his first generalized tonic-clonic seizure, and he was urgently taken to the hospital by family. On further history-taking, the patient admitted that over the past half year he occasionally had unexplained brief “jerks” of both hands upon waking in the morning, causing objects in his hands (e.g., toothbrush, chopsticks) to drop; he did not take it seriously at the time. After admission he was diagnosed with “juvenile myoclonic epilepsy.”
  - Past medical history: Previously healthy, no significant past medical history, no history of drug allergies
  - Current medications: Sodium valproate sustained-release tablets 500mg orally twice daily
  - Lifestyle: Significant academic stress; during final-exam preparation he sometimes stays up late until 1–2 a.m. Likes playing video games, especially fast-paced shooter games with intense lighting effects. Somewhat introverted and unwilling to proactively discuss his illness with others.
  - Vital signs: blood_pressure=118/75 mmHg；heart_rate=76 bpm；respiratory_rate=18 breaths/min；temperature=36.8°C
  - Physical examination: Alert and clear-minded, fluent speech. No abnormalities on cardiac, pulmonary, or abdominal examination. Neurologic examination: cranial nerves (-); normal muscle strength and tone in all extremities; normal sensory examination; no pathologic reflexes elicited.
  - Ancillary tests: CBC, liver and kidney function, and electrolytes all within normal ranges. Non-contrast brain MRI showed no definite abnormalities. Video EEG (VEEG) monitoring: normal background activity during wakefulness and sleep; generalized 4–6Hz polyspike-and-slow-wave discharges across all leads; hyperventilation and photic stimulation could provoke. Conclusion consistent with electrophysiologic changes of generalized epilepsy.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
