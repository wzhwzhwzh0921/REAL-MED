case_id: chronic_disease_management/chronic_disease_management_033
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  At the IBD specialty clinic, as the attending physician, you informed Wang Hao of the diagnostic results and an initial treatment plan. “Student Wang Hao, based on your colonoscopy and pathology results, we can clearly diagnose ‘ulcerative colitis.’ It is currently in a moderately active phase. We will first use mesalazine to control the inflammation.”
  
  Upon hearing the unfamiliar term “ulcerative colitis,” Wang Hao’s expression immediately became grave, and his original anxiety turned into obvious panic. With a tightly furrowed brow, he pressed you with questions: “Doctor, is this disease very serious? I read online that this is ‘an immortal cancer’—it can’t be cured for life. Will I get colon cancer in the future? Can I still attend school normally, take exams, graduate, and find a job? In the future, is it true that I won’t be able to eat anything? Do I have to take this medicine for the rest of my life?”
  
  Facing this young man’s series of fear-filled and confused questions, you realized that beyond writing prescriptions, what is more important is to immediately provide him with a clear, scientific, and compassionate education and support plan to help him get through this most difficult period and correctly begin the long journey of living with the disease.
  
  **Patient information:**
  - Name: Wang Hao, male, 20 years old, sophomore university student (Computer Science major)
  - Chief complaint: Recurrent mucopurulent bloody stools with abdominal pain for 2 months, worsened for 1 week.
  - History of present illness: Two months ago, without an obvious trigger, the patient developed diarrhea with mucopurulent bloody stools, 3–4 times per day, accompanied by dull left lower abdominal pain and tenesmus. He believed it was “gastroenteritis” and did not take it seriously. Over the past week, symptoms worsened: bowel movements increased to 6–8 times per day, all mucopurulent bloody stools; abdominal pain and tenesmus became significant; he felt fatigue and poor appetite, severely affecting attending classes and studying. Because symptoms persisted without relief, he came to the Gastroenterology outpatient clinic of our hospital. The patient appears anxious and is very worried about his condition.
  - Past medical history: Previously healthy; self-reported mild lactose intolerance, prone to abdominal bloating after drinking pure milk.
  - Current medications: Just started: oral mesalazine enteric-coated tablets 1.0g QID
  - Lifestyle: Lives in a dorm on campus; nearing final exams; often stays up late until after midnight during exam preparation; irregular meals, mostly takeout (spicy hotpot, barbecue). Previously played basketball, but stopped exercising in the past month due to fatigue and frequent diarrhea.
  - Vital signs: temperature=37.2 °C；heart_rate=94 bpm；respiratory_rate=18 breaths/min；blood_pressure=125/75 mmHg
  - Physical examination: Clear consciousness, appears slightly fatigued, mildly pale complexion. No abnormalities on cardiac and pulmonary auscultation. Abdomen soft and flat; mild deep tenderness in the left lower quadrant, no rebound tenderness or guarding. Hyperactive bowel sounds, about 8 times/min.
  - Ancillary tests: Complete blood count: WBC 11.2 x 10^9/L, Hb 115 g/L, PLT 360 x 10^9/L. Inflammatory markers: CRP 28 mg/L, ESR 32 mm/h. Stool routine + occult blood: pus cells (+++), red blood cells (++), occult blood test (strongly positive). Colonoscopy: lesions start from the rectum and continuously involve the sigmoid colon; diffuse mucosal congestion and edema, blurred vascular pattern, multiple erosions and shallow ulcers with adherent purulent exudate, easy bleeding on contact (Mayo endoscopic subscore 2). Pathology biopsy: lamina propria with heavy infiltration of neutrophils, lymphocytes, and plasma cells; cryptitis and crypt abscesses present, consistent with ulcerative colitis (active phase) changes.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
