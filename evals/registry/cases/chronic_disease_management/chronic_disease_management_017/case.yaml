  **Case number:`chronic_disease_management_017`chronic_disease_management_017`
  
  Mr. Wang, a 48-year-old office manager, comes for consultation after abnormal blood glucose was found on an annual health checkup. He is 175 cm tall and weighs 90 kg, which is obesity (BMI 29.4 kg/m²). He has a 5-year history of hypertension and usually takes irbesartan. He complains of persistent fatigue over the past few months, but clearly denies typical “three polys and one loss” symptoms, especially no unexplained weight loss.
  
  On repeat testing after admission, his fasting plasma glucose is 14.5 mmol/L and glycated hemoglobin is as high as 9.8%. However, importantly negative findings include a negative urine ketone test, and his renal function is completely normal. Given his markedly elevated blood glucose, you need to develop an initial glucose-lowering regimen that is both effective and reasonable.
  
  **Patient information:**
  - Name: Mr. Wang, male, 48 years old, office worker
  - Chief complaint: Elevated blood glucose found on physical examination for 1 week
  - History of present illness: One week ago, during his employer’s annual health checkup, the patient was found to have fasting plasma glucose 14.5 mmol/L and HbA1c 9.8%. The patient reports mild fatigue over the past half year, but denies obvious polydipsia, polyuria, polyphagia, or unexplained weight loss. He therefore came to the endocrinology outpatient clinic for systematic diagnosis and treatment.
  - Past medical history: Hypertension for 5 years, taking irbesartan 150mg qd, blood pressure control acceptable; fatty liver disease for 3 years, without regular treatment
  - Current medications: Irbesartan 150mg qd
  - Lifestyle: Sedentary office work, exercises less than once per week, diet tends to be greasy, frequent social engagements, does not smoke, occasional alcohol use.
  - Vital signs: blood_pressure=135/85 mmHg；heart_rate=80 bpm；temperature=36.5°C
  - Physical examination: Height 175cm, weight 90kg (BMI 29.4 kg/m²), waist circumference 102cm. Alert and oriented, in good general condition. No obvious abnormalities on cardiac, pulmonary, or abdominal examination. No edema in both lower extremities, dorsalis pedis pulses palpable bilaterally, 10g monofilament test sensation normal.
  - Ancillary tests: Fasting plasma glucose 14.5 mmol/L, 2-hour postprandial glucose 19.8 mmol/L, HbA1c 9.8%. Urinalysis: urine glucose (++++), urine ketones negative. Liver function: ALT 55 U/L. Renal function: eGFR 95 ml/min/1.73m². Lipids: LDL-C 3.5 mmol/L.
  
