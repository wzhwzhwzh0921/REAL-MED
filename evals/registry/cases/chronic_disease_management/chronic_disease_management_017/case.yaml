  **Case number:`chronic_disease_management_017`chronic_disease_management_017`. The patient’s complete clinical data has been provided above; there is no need to call any case-loading tool again. Please directly use the currently available chronic-disease HIS system tools to sequentially enter necessary medical orders such as diagnoses, prescriptions, laboratory tests, imaging, and a follow-up plan; after completion, use the available HIS submit tool to confirm and submit the orders. Do not request clarification merely because a tool’s display name differs slightly from its description. When calling the submit tool, you must fill in the `analysis_conclusion` parameter and provide as detailed a final analysis conclusion as possible, covering diagnostic basis, risk stratification or disease severity, rationale for treatment choices, test and monitoring arrangements, follow-up plan, and necessary up-referral or referral considerations.
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
