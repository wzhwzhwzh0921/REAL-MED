case_id: chronic_disease_management/chronic_disease_management_012
task_type: chronic_disease_management
prompt: |
  [Task Prompt]
  In the endocrine clinic follow-up room, you are facing Mr. Wang Jianguo, who looks worried. The latest lab report lies quietly on the desk, and the HbA1c value of 9.5% is particularly striking. “Mr. Wang, you see, although we have used three good oral medications, your blood glucose still hasn’t been controlled, and the fatigue you’ve been feeling recently is for this reason,” you explain gently. “Given your current situation, I recommend that we start adding insulin therapy. This is currently the most effective way to help bring your blood glucose down and protect your body.”
  
  Before you finish speaking, Mr. Wang immediately becomes agitated: “Doctor, do I really have to inject now? I heard other drivers say that once you use this stuff, it’s like drugs—you can’t stop! And I’m on the road every day; I don’t have regular times for meals or sleep—how can I inject? What if I get dizzy and my hands tremble while driving? That could kill someone!” His eyes are full of fear, resistance, and deep concern about occupational safety. You realize that before prescribing insulin, a carefully designed, patient-centered health education intervention is the crucial first step that will determine whether treatment succeeds.
  
  **Patient information:**
  - Name: Wang Jianguo, male, 58 years old, long-haul truck driver
  - Chief complaint: Worsening dry mouth, polydipsia, and fatigue for more than 1 month.
  - History of present illness: The patient was diagnosed with type 2 diabetes mellitus 10 years ago and has been on long-term oral medication therapy. Over the past year, despite combination therapy with three oral hypoglycemic agents, glycemic control has remained suboptimal (HbA1c was 8.8% 3 months ago). Over the past month, the patient has noticed marked worsening of dry mouth, polydipsia, increased nocturia, and generalized fatigue. Self-monitored occasional fingertip capillary glucose values fluctuate between 10-16 mmol/L. The patient is very anxious and resistant to initiating insulin therapy, believing that “once on insulin, you can never stop for life” and that it means “the disease has reached the most severe stage.”
  - Past medical history: 10-year history of type 2 diabetes mellitus; 8-year history of hypertension; prior health checkups did not indicate definite diabetic nephropathy or retinopathy
  - Current medications: Metformin tablets 1.0g, twice daily; Gliclazide modified-release tablets 60mg, once daily; Dapagliflozin tablets 10mg, once daily
  - Lifestyle: Long-term truck driving away from home; extremely irregular daily schedule and meals; often relies on fast food or high-fat/high-salt foods; has a habit of drinking baijiu with coworkers at dinner. Smokes 1 pack per day. Due to work constraints, almost no regular exercise, and very low frequency of blood glucose monitoring.
  - Vital signs: blood_pressure=145/90 mmHg；heart_rate=82 bpm；body_temperature=36.5℃；respiration=18 次/分
  - Physical examination: Height 172cm, weight 85kg, BMI 28.7 kg/m². Central obesity, waist circumference 98cm. Clear consciousness, fair general condition. No obvious abnormalities on cardiac, pulmonary, and abdominal examination. Skin of both feet intact, warm, no ulceration; dorsalis pedis pulses palpable; 10g monofilament test shows symmetrical sensation present in both feet.
  - Ancillary tests: Fasting plasma glucose (FPG): 11.5 mmol/L; 2-hour postprandial glucose (2hPG): 16.8 mmol/L; Glycated hemoglobin (HbA1c): 9.5%; Urinalysis: glucose (+++), protein (-); Renal function: eGFR 85 ml/min/1.73m²。
  
  [Answer Format]
  You are connected to the hospital Chronic System and can complete diagnosis and treatment operations via system tools. Based on the patient's clinical condition, independently determine which actions need to be performed—enter diagnoses, prescribe medications, arrange tests, formulate a follow-up plan, etc.—and enter them one by one through the system tools.
  The patient's complete clinical data has been provided above; do not call any patient-loading tool again. Use the available Chronic-System HIS tools directly to enter the diagnoses, prescriptions, laboratory tests, imaging, and follow-up plan in sequence, then call the available submit tool to confirm and submit the orders. Do not request clarification merely because a tool's display name differs slightly from its description.
  When calling the submit tool, the `analysis_conclusion` parameter is **required** and must contain a thorough final analysis covering: (1) diagnostic reasoning, (2) risk stratification or disease-severity assessment, (3) rationale for the chosen treatment, (4) workup and monitoring plan, (5) follow-up plan, and (6) any necessary up-referral / specialty-referral considerations.
