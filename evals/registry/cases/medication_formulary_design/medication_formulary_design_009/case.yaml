case_id: medication_formulary_design/medication_formulary_design_009
task_type: medication_formulary_design
prompt: |
  [Task Prompt]
  You are the Medical Director of a national-level rare disease diagnosis and treatment center. You plan to establish an in-hospital standardized formulary for a multidisciplinary Prader–Willi syndrome (PWS) management clinic, for unified retrieval and prescribing reference by clinicians and pharmacists. The clinic serves genetically confirmed patients ranging from infants and young children to adults. Patients’ ability to pay varies substantially; some therapies can be supported through medical insurance or assistance/charitable programs. Emphasize long-term medication accessibility and adherence.
  
  **Formulary construction principles:**
  - Drugs may be included only if they fall within NMPA-approved indications; if off-label (outside indication) use is involved, the table must annotate the evidence type, evidence level, and applicable boundaries.
  - For each generic name, select one representative brand; prioritize options listed in the NRDL or those with high accessibility via assistance/charitable programs.
  - For every drug, label the reimbursement category and payment attributes (medical insurance, assistance/charity, fully self-pay, etc.) item by item.
  
  **Tasks:**
  1. Consolidate the drug categories in the PWS formulary; stratify and categorize them by therapeutic positioning, and state each category’s NMPA approval status and the framework for off-label evidence.
  2. Create several single-disease prescription examples covering typical medication combinations across different treatment stages and patient scenarios, reflecting prescription structure and medication pathways.
  3. Create several prescription examples for PWS with comorbid diseases or special situations; explain the rationale for drug selection, dose/administration-frequency adjustments, intensified monitoring, and discontinuation/switching considerations.
  4. Provide strong alerts for key safety risks of formulary drugs, covering pre-medication assessment and screening, core monitoring indicators, interaction risks and sedation/anesthesia-related risks, risks and management triggers in special populations.
  [Answer Format]
  Submit a single Excel file (`.xlsx`) via the `present_files` tool. Plain-text-only responses are not accepted.
  **Hard scoring constraint: if no `.xlsx` is submitted via `present_files`, this question is automatically scored 0.**
  The `.xlsx` formulary must include the following columns:
  - Drug category / Generic name / Representative brand / Dosage form & strength / Route of administration / Therapeutic positioning / Mechanism of action / NMPA-approved indication & approval status / Off-label evidence & applicable boundaries / Reimbursement category / Payment attributes & key restriction notes / Recommended regimen & dose / Course & adjustment notes / Key contraindications & warnings / Common adverse reactions / Key monitoring indicators / Applicable population & scenarios / Special-population precautions / Remarks
  Charts may be added to visualize key data comparisons.
