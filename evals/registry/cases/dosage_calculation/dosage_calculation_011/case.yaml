case_id: dosage_calculation/dosage_calculation_011
task_type: dosage_calculation
prompt: |
  [Task Prompt]
  Mr. Wang, male, 38 years old, weight 140 kg. Chief complaint: “Nausea and epigastric pain for 6 hours after accidental ingestion of antipyretic analgesics.” Present illness: After emotional agitation, he swallowed a large quantity at one time of a compound tablet containing acetaminophen (paracetamol). About 6 hours later, he developed persistent nausea, vomited twice, and had dull epigastric pain, without jaundice. Emergency physical examination: Conscious and alert; heart rate 102 beats/min; blood pressure 138/86 mmHg; abdomen soft; mild epigastric tenderness on light palpation; no rebound tenderness. Ancillary tests: Blood acetaminophen concentration falls in the Rumack–Matthew high-risk zone; ALT 165 U/L, AST 148 U/L, INR 1.3; creatinine normal. Plan: detoxification using the IV N-acetylcysteine (NAC) 3-bag 21-hour regimen. The patient is obese; dosing must be capped using 100 kg maximum. NAC stock solution concentration is 200 mg/mL. The diluent is 0.45% sodium chloride injection. The pharmacist notes that “displacement preparation” is required to meet the target total infusion volume and pump settings.
  
  Please calculate this patient’s infusion_duration_h.
  
  [Answer Format]
  [Calculation requirement] All numerical computations must be performed by calling the medcal MCP tools provided by the system (tool names start with `medcal_`).
  Producing numerical results from internal model knowledge alone is forbidden.
  Save the complete calculation process and results as a Word document (.docx), and submit it through the `present_files` tool. Do not respond with plain text only.
  **Hard scoring constraint: if no .docx is submitted via `present_files`, this question is automatically scored 0.**
