case_id: soap_documentation/soap_documentation_036
task_type: soap_documentation
prompt: |
  [Task Prompt]
  You are a senior gastroenterology physician. On the morning of November 10, 2024, a 29-year-old man, Li Jun (pseudonym), presents to clinic supported by his wife. Please analyze his condition based on the following clinic dialogue summary, chief complaint/history, and physical examination findings, and write a professional SOAP note for this visit.
  **Chief Complaint and History of Present Illness:**
  Li Jun is a senior software engineer who appears markedly anxious and fatigued. When sitting down, he keeps pressing his upper abdomen. Chief complaint: “Persistent dull epigastric pain with weight loss for 3 months, worsened with melena for 3 days.”
  
  He speaks rapidly and tells you: “Doctor, did something grow in my stomach? I’ve lost almost 8 kg these past three months! At first it was just bloating and a dull ache in my stomach. I thought it was from overtime and fatigue, so I took some stomach medicine and didn’t pay attention. But over the past month it has been getting worse and worse. Especially recently, it feels like there’s fire burning in my stomach, and it’s a constant pain—it doesn’t matter whether I’ve eaten or not.”
  
  He pauses, looking somewhat frustrated: “I work in IT. My projects are always tight and the pressure is high. Headaches are an old problem for me. I keep ibuprofen on my desk year-round, and when a headache flares up I take two pills. These past few months, to keep up with progress, I’ve been taking it a bit more frequently. Over the last three weeks, as soon as anything goes down, my stomach hurts piercingly. I really don’t dare eat—I’ve basically starved myself thin. Starting the day before yesterday, I noticed my stool color wasn’t right—black like road asphalt. This morning when I got up too quickly, I felt dizzy and my vision went dark and I almost fell.”
  
  His wife adds: “Doctor, he usually eats irregularly and he smokes a lot—about half a pack a day. Recently his face has been frighteningly pale. We looked it up online and it said ‘melena plus rapid weight loss’ is usually… that kind of terminal illness. We’re very scared. Please make sure to check him thoroughly.”
  **Past Medical History and Family History:**
  Previously healthy. Longstanding history of tension-type headache, self-managed with analgesics. Smoking history: 5 years (5–10 cigarettes/day). Occasional alcohol use. Allergy: “penicillin” (previously developed a rash). No family history of gastric cancer or other gastrointestinal malignancies.
  **Physical Examination Findings:**
  Vital signs: Temperature 37.0℃; heart rate 88/min; blood pressure 118/76 mmHg; respiratory rate 16/min; SpO2 99%.
  
  General: Alert and oriented; anxious. Pale complexion; pale palpebral conjunctiva (suggestive of anemia). Thin body habitus.
  
  Abdominal exam: Abdomen flat; no visible intestinal contour or peristaltic waves. Marked deep tenderness in the upper abdomen (subxiphoid/epigastric). On palpation, localized “guarding/resistance” and a sense of fullness are noted; no definite hard mass palpated. No rebound tenderness or muscular rigidity. Liver and spleen not palpable below the costal margins. Murphy sign negative.
  
  Digital rectal exam: Black stool on glove (tarry stool).
  
  Ancillary tests (rapid outpatient testing): CBC shows Hb 92 g/L (microcytic). Fecal occult blood test (FOBT) positive (++).
  [Analysis requirement] During diagnostic reasoning, proactively use search tools to look up diagnostic criteria, key differentiating features, and typical clinical presentations of the relevant diseases, and explicitly cite the search-derived information in the report as the basis for your diagnosis, explaining why this diagnostic conclusion was reached.
  [Answer Format]
  [Formatting Instructions] A SOAP note template file is provided for this question (`01_attachment.pdf`). Please write the medical record according to the structure and formatting specifications of that template, and output it as a Word document.
  Save the complete diagnostic and management report as a Word document (`.pdf`) and submit it through the `present_files` tool. Plain-text-only responses are not accepted.
  **Hard scoring constraint: if no `.pdf` is submitted via `present_files`, this question is automatically scored 0.**
  The `.pdf` SOAP note must:
  1. Follow the structure and formatting of the provided `01_attachment.pdf` template.
  2. Include the four standard SOAP sections (Subjective / Objective / Assessment / Plan).
  3. Cite search-derived diagnostic criteria and differential evidence in the Assessment section.
