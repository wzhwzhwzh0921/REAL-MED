case_id: pharmacy_inventory_management/pharmacy_inventory_management_025
task_type: pharmacy_inventory_management
prompt: |
  [Task Prompt]
  Outpatient pharmacist task: Today you need to verify a “two-drug combination” prescription for a pediatric patient who is **9 years old, weighs 30 kg, and has fever**. You must, according to the package insert, **verify the maximum daily dose using an mg/kg body-weight conversion**, then convert it into “dose per administration (tablets/vials/mL) × number of doses per day”, and also evaluate whether the short-course therapy will cause inventory to fall below the reorder alert threshold. Note: The prompt will not contain any drug generic names or brand names; you must first uniquely match the specific product in the attached list using dosage form/specification/indication clues, and then perform the calculations.
  
  Sub-question 1 (oral antibacterial drug verification): Prescription A is an oral antibacterial tablet that is “**allowed for age ≥8 years; contraindicated for age <8 years**”.  
  (1) Identify this drug from the pharmacy inventory.  
  (2) Calculate this patient’s maximum daily dose (mg/day). Convert it to the maximum mg per dose.  
  (3) Convert it to the maximum **number of tablets per dose** (round up). For a **3-day** course, after deducting inventory, will it fall below the reorder alert threshold?
  
  Sub-question 2 (oral antipyretic analgesic verification): Prescription B is a compound tablet “indicated for **antipyretic/analgesic use in children ≥25 kg**”. Each tablet contains **acetaminophen 330 mg** (also contains vitamin components).  
  (1) Identify this drug from the pharmacy inventory.  
  (2) What is this patient’s maximum daily acetaminophen dose (mg/day)? If designing a maximum-limit regimen of **4 times daily**, what is the maximum mg per dose?  
  (3) Convert it to the maximum **number of tablets per dose** (round up). For a **2-day** course, after deducting inventory, will it reach/breach the reorder alert threshold?
  
  Sub-question 3 (IV analgesic verification, anesthesia-related outpatient consult sheet): There is another consult order proposing an “opioid intravenous injection, **10 mL contains 0.5 mg (i.e., 500 μg)**”, to be used during cardiopulmonary bypass surgery.  
  (1) Identify this drug from the pharmacy inventory.  
  (2) What is the maximum total amount for the initial dose for this patient (μg)?  
  (3) Convert it to **how many vials** are needed for one administration (**500 μg per vial**, round up). Based on **1 administration**, after deducting inventory, will it fall below the reorder alert threshold?
  
  Note: Attachment: drug inventory list `01_inventory.xlsx` (260 rows). Data should be queried via the MCP tool `pharmacy_ops` with `case_id: `pharmacy_inventory_management_025` — do not read the file directly.
  [Answer Format]
  Submit **both** of the following files via the `present_files` tool. Plain-text-only responses are not accepted.
  **Hard scoring constraint: if both `.docx` and `.xlsx` are not submitted via `present_files`, this question is automatically scored 0.**
  
  ### 1. `.docx` — Analysis & Conclusions
  Must fully document the analysis process and at minimum include:
  1. **Drug identification**: how the cues in the question (dosage form / specification / indication / route, etc.) were matched to specific products in the drug catalog; state the matched generic names.
  2. **Tool-call log**: list which MCP tools (e.g. `search_drug_catalog` / `get_drug_base_info` / `get_inventory_record`) were called and the key information returned by each (e.g. inventory count, unit price, reorder threshold, dosage, package-insert points).
  3. **Computation and judgment steps**: for each sub-question, show the formula / unit conversion / comparison against the reorder threshold step by step with intermediate values — do not show the final result alone.
  4. **Final conclusion**: an explicit answer for each sub-question (identified drug, computed value, whether the threshold was breached, reorder amount, etc.).
  
  ### 2. `.xlsx` — Calculation Results & Inventory Reconciliation
  Calculation results, inventory verification, and structured operation records. If the problem does not require modifying the inventory details, you may return the original attached `.xlsx` while retaining necessary calculations/annotations.
