case_id: pharmacy_inventory_management/pharmacy_inventory_management_014
task_type: pharmacy_inventory_management
prompt: |
  [Task Prompt]
  Outpatient prescription audit task (special intervention for pregnancy-contraindicated Chinese patent medicines). A pregnant woman visits the clinic. The physician issues a prescription with the goal of “reducing jaundice.” During review, the pharmacist finds that the prescription includes a “pregnancy-contraindicated” jaundice-reducing granular Chinese patent medicine, requiring immediate intervention and replacement/adjustment recommendations. From the perspective of a prescription-auditing pharmacist, complete the following sub-questions focusing on indications, contraindications, and special populations (pregnancy), and write the key points of how you would communicate with the physician (including risk warnings and recommendations). Note: The stem will not show any generic name or brand name; you must uniquely match the specific product in the attached list using clues such as dosage form/specification/indication before performing any calculations.
  
  Sub-question 1 (Indication + directions check): The prescription includes a tablet described as: “for local vaginal administration, insert deep into the vagina at bedtime; usually one dose is sufficient; if necessary, it may be repeated once 4 days later.”
  (1) Identify the drug’s generic name, and query its current inventory and unit price.
  (2) Determine what type of infection the indication points to. If the patient’s only complaint is “skin itching with no discharge,” would you approve it? Provide the audit conclusion and rationale.
  (3) Write the key points for communicating with the physician (including risk warning(s) and recommendation(s), 1–2 items).
  
  Sub-question 2 (Allergy contraindication + quantity calculation): For the “locally administered vaginal tablet” described above, the patient reports an allergy to ingredients of this class of drug.
  (1) Identify the drug’s generic name, and query its current inventory and unit price.
  (2) Must the prescription be intercepted? Provide the audit conclusion and basis.
  (3) Calculate how many tablets should be dispensed for this visit according to “1 tablet at bedtime, total of 2 treatments (the interval has already met the prescriber’s instruction).”
  (4) Based on the inventory and the reorder warning threshold you queried, determine whether dispensing this time will trigger replenishment (use the attachment data as the source of truth).
  (5) Write the key points for communicating with the physician (including risk warning(s) and recommendation(s), 1–2 items).
  
  Sub-question 3 (Contraindication + special population + quantity calculation): The prescription also contains an IV infusion product described as: “250 mL IV drip; each bag contains 0.5 g of active ingredient; contraindications state: contraindicated in patients with liver disease or liver injury; infusion rate should not be too fast; may cause transient yellow discoloration of the sclera or skin.” If this pregnant woman has a history of abnormal liver function and her jaundice is worsening this time:
  (1) Identify the drug’s generic name, and query its current inventory and unit price.
  (2) How would you handle the audit (recommend discontinuation / switch therapy / additional testing)? Provide the audit conclusion and basis.
  (3) Calculate how many bags need to be dispensed according to “0.5 g per dose, twice daily, for 3 days.”
  (4) Based on the inventory and reorder warning threshold you queried, determine whether the post-dispensing inventory will fall below the warning threshold (use the attachment data as the source of truth).
  (5) Write the key points for communicating with the physician (including risk warning(s) and recommendation(s), 1–2 items).
  
  Organize your final output in the format “For each sub-question: audit conclusion → basis → communication key points (1–2 items) → calculation results.” Note: Do not include any drug generic name or brand name in the main text body.
  
  Note: Attachment: drug inventory list `01_inventory.xlsx` (272 rows). Data should be queried via the MCP tool `pharmacy_ops` with `case_id: `pharmacy_inventory_management_014` — do not read the file directly.
  [Answer Format]
  Submit **both** of the following files via the `present_files` tool. Plain-text-only responses are not accepted.
  **Hard scoring constraint: if both `.docx` and `.xlsx` are not submitted via `present_files`, this question is automatically scored 0.**
  
  ### 1. `.docx` — Analysis & Conclusions
  Must fully document the analysis process and at minimum include:
  1. **Drug identification**: how the cues in the question (dosage form / specification / indication / route, etc.) were matched to specific products in the drug catalog; state the matched generic names.
  2. **Tool-call log**: list which MCP tools (e.g. `search_drug_catalog` / `get_drug_base_info` / `get_inventory_record`) were called and the key information returned by each (e.g. inventory count, unit price, reorder threshold, dosage, package-insert points).
  3. **Computation and judgment steps**: for each sub-question, show the formula / unit conversion / comparison against the reorder threshold step by step with intermediate values — do not show the final result alone.
  4. **Final conclusion**: an explicit answer for each sub-question (identified drug, computed value, whether the threshold was breached, reorder amount, etc.).
  
  ### 2. `.xlsx` — Calculation Results & Inventory Reconciliation
  Calculation results, inventory verification, and structured operation records. If the problem does not require modifying the inventory details, you may return the original attached `.xlsx` while retaining necessary calculations/annotations.
