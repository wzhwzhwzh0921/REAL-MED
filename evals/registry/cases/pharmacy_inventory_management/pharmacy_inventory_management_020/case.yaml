case_id: pharmacy_inventory_management/pharmacy_inventory_management_020
task_type: pharmacy_inventory_management
prompt: |
  [Task Prompt]
  Pediatric pharmacist work alert: Today you must verify the following 3 medication orders with calculations for “weight-based dose conversion + single-dose/daily maximum limits + number of sachets/vials to dispense + inventory reorder (warning) threshold”, and write the calculation steps and whether any limit is exceeded on the review sheet. Note: The stem will not provide any drug generic name or brand name; you must uniquely match to a specific product in the attached list based on dosage form/specification/indication/route clues before performing calculations.
  
  Sub-question 1 (oral granules, 10 mg/sachet): Child is 3 years old, weight 14.0 kg, acute diarrhea, symptomatic treatment. Order: “PO 3 times daily, 1.5 mg/kg per dose, for 5 days.” Please complete:
  (1) Identify the generic name of this drug, and query current inventory and unit price.
  (2) Calculate how many mg should be given per dose, and convert to how many sachets per dose (round up).
  (3) Verify whether the total daily mg/kg exceeds the package insert limit: “total daily dose not to exceed 6 mg/kg/day”.
  (4) Calculate how many sachets are needed total for 5 days, and verify whether the post-dispensing inventory will fall below the replenishment warning threshold.
  
  Sub-question 2 (post-chemotherapy subcutaneous injectable powder, 3 mg/vial; before use, add 1 mL sterile water for injection to each vial to dissolve and immediately inject subcutaneously): Child weight 18.6 kg. Order: “Start 24–48 h after completion of chemotherapy, once daily, 50 μg/kg, for 7 days.” Please complete:
  (1) Identify the generic name of this drug, and query current inventory and unit price.
  (2) Calculate how many mg should be given per dose (note μg→mg conversion), and convert to how many vials per dose (round up).
  (3) Calculate the total number of vials needed for 7 days, and verify whether the post-dispensing inventory triggers the replenishment warning threshold.
  (4) If the order were written as “1 mg per dose”, state the direction of deviation versus the recommended weight-based dose (overdose/underdose).
  
  Sub-question 3 (intravenous antifungal injectable powder, 50 mg/vial; must be reconstituted and diluted for IV infusion): Child weight 25.0 kg, invasive fungal infection requiring urgent treatment. Order: “6 mg/kg, once daily, for 4 days.” Please complete:
  (1) Identify the generic name of this drug, and query current inventory and unit price.
  (2) Calculate how many mg should be given per dose, and convert to how many vials per dose (round up).
  (3) Calculate the total number of vials needed for 4 days.
  (4) Based on current inventory, assess whether there is a risk of “unable to ensure the full course of therapy”, and provide pharmacy handling recommendations (e.g., split dispensing, urgent transfer/borrowing from another site first, etc.).
  
  Note: Attachment: drug inventory list `01_inventory.xlsx` (300 rows). Data should be queried via the MCP tool `pharmacy_ops` with `case_id: `pharmacy_inventory_management_020` — do not read the file directly.
  [Answer Format]
  Submit **both** of the following files via the `present_files` tool. Plain-text-only responses are not accepted.
  **Hard scoring constraint: if both `.docx` and `.xlsx` are not submitted via `present_files`, this question is automatically scored 0.**
  
  ### 1. `.docx` — Analysis & Conclusions
  Must fully document the analysis process and at minimum include:
  1. **Drug identification**: how the cues in the question (dosage form / specification / indication / route, etc.) were matched to specific products in the drug catalog; state the matched generic names.
  2. **Tool-call log**: list which MCP tools (e.g. `search_drug_catalog` / `get_drug_base_info` / `get_inventory_record`) were called and the key information returned by each (e.g. inventory count, unit price, reorder threshold, dosage, package-insert points).
  3. **Computation and judgment steps**: for each sub-question, show the formula / unit conversion / comparison against the reorder threshold step by step with intermediate values — do not show the final result alone.
  4. **Final conclusion**: an explicit answer for each sub-question (identified drug, computed value, whether the threshold was breached, reorder amount, etc.).
  
  ### 2. `.xlsx` — Calculation Results & Inventory Reconciliation
  Calculation results, inventory verification, and structured operation records. If the problem does not require modifying the inventory details, you may return the original attached `.xlsx` while retaining necessary calculations/annotations.
attachments:
