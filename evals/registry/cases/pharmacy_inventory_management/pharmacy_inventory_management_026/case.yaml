case_id: pharmacy_inventory_management/pharmacy_inventory_management_026
task_type: pharmacy_inventory_management
prompt: |
  [Task Prompt]
  NICU pharmacist on-call task. The inventory list for this shift includes multiple high-risk medications for which “neonatal/pediatric doses must be weight-based.” When physicians enter orders, they often write only mg/kg or weight-based mL/kg. You must convert these into “the exact mg per dose, the corresponding volume in mL, and the minimum number of whole packages to dispense,” while also verifying that the total amount within the treatment course does not exceed the maximum limit in the package insert, and performing inventory checks against reorder alert thresholds. Note: the stem will not contain any generic names or brand names; you must use the dosage form/specification/indication/route clues to uniquely match each drug to a specific item in the attached inventory list before doing any calculations. Complete the following 3 subtasks; in the `.docx`, write the key steps (including unit conversions), and in the `.xlsx`, provide the final quantities to dispense and the remaining inventory balance.
  
  2) Pulmonary surfactant for RDS rescue: A preterm infant weighs 1.28 kg. The order is “initial dose 200 mg/kg via intratracheal administration; if oxygen supplementation/mechanical ventilation is still needed, give an additional 100 mg/kg 12 hours later; do not exceed the maximum total dose.” Calculate:
  (1) Identify the generic name of this medication, and query the current inventory and unit price.
  (2) How many mg are needed for the initial dose and for the additional dose, respectively, and what are the corresponding volumes in mL.
  (3) Verify whether the cumulative mg/kg (under “initial dose + 1 additional dose”) exceeds the maximum total dose in the package insert.
  (4) If dispensing must be in whole vials/ampoules, for the initial dose and the additional dose respectively, what is the minimum number of vials/ampoules to prescribe (round up), and how many in total.
  
  3) Antidote injection for acute metal poisoning: A pediatric patient weighs 18.6 kg. The order is “IV injection, 5 mg/kg per dose, every 4–5 hours; for now execute 24 hours (total 5 doses).” Calculate:
  (1) Identify the generic name of this medication, and query the current inventory and unit price.
  (2) mg required per dose and the corresponding mL.
  (3) Minimum number of vials/ampoules required per dose (dispense whole units, round up); total number of vials/ampoules required for 24 hours.
  (4) Complete the inventory check: query current stock and the reorder alert threshold; after execution, will the remaining stock fall below the alert threshold?
  
  4) Oral antibacterial drug (tablet) — pediatric weight-based dosing: A pediatric patient weighs 12.4 kg. The order is “pediatric: 40 mg/kg/day, divided into 3 doses, course 7 days.” Calculate:
  (1) Identify the generic name of this medication, and query the current inventory and unit price.
  (2) Total mg per day and mg per dose.
  (3) Convert each dose into number of tablets (may keep to 0.5 tablet; if whole tablets must be dispensed, also provide the round-up plan).
  (4) Minimum total number of tablets needed for 7 days, and perform the inventory check: query current stock and the reorder alert threshold; will this course trigger/breach the threshold? (Hint: only judge the quantity change in the minimum packaging unit; deduct inventory according to the “minimum number of packaging units to dispense” that you calculated.)
  
  Note: Attachment: drug inventory list `01_inventory.xlsx` (313 rows). Data should be queried via the MCP tool `pharmacy_ops` with `case_id: `pharmacy_inventory_management_026` — do not read the file directly.
  [Answer Format]
  Submit **both** of the following files via the `present_files` tool. Plain-text-only responses are not accepted.
  **Hard scoring constraint: if both `.docx` and `.xlsx` are not submitted via `present_files`, this question is automatically scored 0.**
  
  ### 1. `.docx` — Analysis & Conclusions
  Must fully document the analysis process and at minimum include:
  1. **Drug identification**: how the cues in the question (dosage form / specification / indication / route, etc.) were matched to specific products in the drug catalog; state the matched generic names.
  2. **Tool-call log**: list which MCP tools (e.g. `search_drug_catalog` / `get_drug_base_info` / `get_inventory_record`) were called and the key information returned by each (e.g. inventory count, unit price, reorder threshold, dosage, package-insert points).
  3. **Computation and judgment steps**: for each sub-question, show the formula / unit conversion / comparison against the reorder threshold step by step with intermediate values — do not show the final result alone.
  4. **Final conclusion**: an explicit answer for each sub-question (identified drug, computed value, whether the threshold was breached, reorder amount, etc.).
  
  ### 2. `.xlsx` — Calculation Results & Inventory Reconciliation
  Calculation results, inventory verification, and structured operation records. If the problem does not require modifying the inventory details, you may return the original attached `.xlsx` while retaining necessary calculations/annotations.
