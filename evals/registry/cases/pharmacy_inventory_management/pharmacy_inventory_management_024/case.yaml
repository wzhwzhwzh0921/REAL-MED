case_id: pharmacy_inventory_management/pharmacy_inventory_management_024
task_type: pharmacy_inventory_management
prompt: |
  [Task Prompt]
  Outpatient pediatric prescription review task: There is 1 pediatric patient weighing **12 kg**, presenting with fever/upper respiratory infection–related symptoms. The physician plans to prescribe antipyretic, anti-infective, or other symptomatic/supportive medications. As the pharmacist, follow the package insert requirement of “weight-based dosing (mg/kg)” to complete the following 3 sub-problems: dose conversion, convert each dose to “mL/capsule/vial (bottle)” as applicable, verify dosing frequency and total course quantity, and simultaneously assess whether inventory after dispensing will fall below the reorder alert threshold. Note: The stem will not show any generic name or brand name; you must uniquely match the product to a specific item in the attached list using dosage form/specification/indication/route clues before performing calculations.
  
  Sub-problem 1 (oral capsules): An antibacterial drug is an enteric-coated capsule. The physician prescribes “30 mg/kg per day, divided into 3 doses, for 5 consecutive days.” Please calculate:
  (1) Identify the generic name of this drug, and query its inventory and unit price;
  (2) How many mg should be given per dose?
  (3) Convert to how many capsules per dose (round up to a whole capsule)?
  (4) How many capsules are needed in total for 5 days? Then verify whether the inventory after dispensing is below the reorder alert threshold.
  
  Sub-problem 2 (intramuscular compound antipyretic injection): A compound injectable product, **2 mL/ampoule**, where each ampoule contains an antipyretic-analgesic component (dose calculated based on that component). The physician prescribes “once every 8 hours, for a total of 2 days.” Please calculate:
  (1) Identify the generic name of this drug, and query its inventory and unit price;
  (2) According to the package insert pediatric dosing (calculated based on the antipyretic-analgesic component), how many mg should be given per dose?
  (3) Convert to how many mL should be drawn up per dose (may keep 2 decimal places)?
  (4) For 2 days, how many ampoules are expected to be used (round up by ampoule)? Then verify whether the inventory after dispensing is below the reorder alert threshold. (Hint: You must first convert from mg back to mL, then convert mL to number of ampoules.)
  
  Sub-problem 3 (IV infusion, weight-based dosing): A photosensitizing injectable solution; protect from light during preparation and perform a skin test first. After a negative skin test, dose by body weight, add to 0.9% sodium chloride injection **250 mL** for IV infusion. The physician prescribes “single administration, once.” Please calculate:
  (1) Identify the generic name of this drug, and query its inventory and unit price;
  (2) How many mg does this patient need for one dose?
  (3) How many mL of the original solution should be withdrawn?
  (4) How many vials/ampoules are needed (round up by vial/ampoule)? Then verify whether the inventory after dispensing is below the reorder alert threshold.
  
  Clearly write the calculation process: mg/kg → mg per dose → convert to mL/capsule/vial → rounding-up rules → total quantity and inventory alert conclusion.
  
  Note: Attachment: drug inventory list `01_inventory.xlsx` (271 rows). Data should be queried via the MCP tool `pharmacy_ops` with `case_id: `pharmacy_inventory_management_024` — do not read the file directly.
  [Answer Format]
  Submit **both** of the following files via the `present_files` tool. Plain-text-only responses are not accepted.
  **Hard scoring constraint: if both `.docx` and `.xlsx` are not submitted via `present_files`, this question is automatically scored 0.**
  
  ### 1. `.docx` — Analysis & Conclusions
  Must fully document the analysis process and at minimum include:
  1. **Drug identification**: how the cues in the question (dosage form / specification / indication / route, etc.) were matched to specific products in the drug catalog; state the matched generic names.
  2. **Tool-call log**: list which MCP tools (e.g. `search_drug_catalog` / `get_drug_base_info` / `get_inventory_record`) were called and the key information returned by each (e.g. inventory count, unit price, reorder threshold, dosage, package-insert points).
  3. **Computation and judgment steps**: for each sub-question, show the formula / unit conversion / comparison against the reorder threshold step by step with intermediate values — do not show the final result alone.
  4. **Final conclusion**: an explicit answer for each sub-question (identified drug, computed value, whether the threshold was breached, reorder amount, etc.).
  
  ### 2. `.xlsx` — Calculation Results & Inventory Reconciliation
  Calculation results, inventory verification, and structured operation records. If the problem does not require modifying the inventory details, you may return the original attached `.xlsx` while retaining necessary calculations/annotations.
