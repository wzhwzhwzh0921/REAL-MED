case_id: pharmacy_inventory_management/pharmacy_inventory_management_036
task_type: pharmacy_inventory_management
prompt: |
  [Task Prompt]
  The respiratory outpatient clinic’s antitussive/expectorant formulary is planned to be updated. To balance cost control and prioritization of insurance-covered options, the Pharmacy Department plans to further streamline the items that “require out-of-pocket payment by patients,” keeping only those with clear clinical value and controllable inventory structure. At the same time, a disposal plan must be developed for items that have recently been slow-moving, overstocked, or under near-expiry pressure. Note: The prompt will not show any drug generic names or brand names; you must uniquely match each item to a specific product in the attached list using clues such as dosage form / strength / indication, and only then perform calculations. Based on the 8 “out-of-pocket payment required” items in the attached inventory list, complete the formulary selection and inventory reconciliation tasks.
  
  1) Formulary selection and disposal recommendations:
  Among the 8 “out-of-pocket payment required” items, group them by “whether they are related to respiratory antitussive/expectorant use.” Then indicate which items, although unrelated to cough/sputum, still require a disposal recommendation due to clearly excessive inventory (e.g., restrict to certain departments, limit days of prescribing, transfer/reallocate stock, or return/exchange). In the .docx, provide the rationale (combining indication and inventory status).
  
  2) Calculation A (dose conversion + inventory reconciliation): An adult outpatient is planned to use short-term an “oral tablet used for various types of epilepsy.”
  (1) Identify the drug’s generic name, and query its inventory and unit price.
  (2) Based on the prescription parameters, calculate how many tablets are needed per dose (exact value and rounded-up value).
  (3) Calculate the total number of tablets to dispense for the full course.
  (4) Based on this, verify whether the remaining balance after inventory deduction is below the reorder warning threshold (provide calculation process and conclusion in the .xlsx).
  
  3) Calculation B (weight-based mg/kg/day conversion + inventory reconciliation): A child weighing **24 kg**, due to “viscous sputum and difficulty expectorating (can be used for causes such as bronchitis/pneumonia/asthma/bronchiectasis, etc.),” is planned to use an “enteric-coated tablet swallowed whole after meals.”
  (1) Identify the drug’s generic name, and query its inventory and unit price.
  (2) Complete the mg/kg/day conversion according to the package insert/medication plan, and calculate how many mg should be given per dose.
  (3) Convert to how many tablets per dose (exact value and rounded-up value), and calculate how many tablets are needed for the full course.
  (4) Determine whether the post-deduction inventory is below the warning threshold (.xlsx).
  
  4) Calculation C (dose by wound area + inventory reconciliation): The outpatient dressing-change room plans to use a “topical ointment for superficial second-degree / deep second-degree burns and scalds.” If a patient has a wound area of **240 cm²**, dressing change is required once daily for 3 consecutive days.
  (1) Identify the drug’s generic name, and query its inventory and unit price.
  (2) Using the package insert’s area-based dosing rule, calculate how many grams are needed per day.
  (3) Calculate the total grams needed for 3 days, and convert to the minimum number of tubes that must be dispensed.
  (4) Verify whether the remaining inventory after deduction is below the warning threshold (.xlsx).
  
  Submission requirements: In the .docx, provide the final list of items to “retain / restrict / move out (remove/transfer)” and the reasons; the .xlsx must include the original parameters, formulas, results, and inventory warning-threshold judgments for the above three calculation tasks.
  
  Note: Attachment: drug inventory list `01_inventory.xlsx` (290 rows). Data should be queried via the MCP tool `pharmacy_ops` with `case_id: `pharmacy_inventory_management_036` — do not read the file directly.
  [Answer Format]
  Submit **both** of the following files via the `present_files` tool. Plain-text-only responses are not accepted.
  **Hard scoring constraint: if both `.docx` and `.xlsx` are not submitted via `present_files`, this question is automatically scored 0.**
  
  ### 1. `.docx` — Analysis & Conclusions
  Must fully document the analysis process and at minimum include:
  1. **Drug identification**: how the cues in the question (dosage form / specification / indication / route, etc.) were matched to specific products in the drug catalog; state the matched generic names.
  2. **Tool-call log**: list which MCP tools (e.g. `search_drug_catalog` / `get_drug_base_info` / `get_inventory_record`) were called and the key information returned by each (e.g. inventory count, unit price, reorder threshold, dosage, package-insert points).
  3. **Computation and judgment steps**: for each sub-question, show the formula / unit conversion / comparison against the reorder threshold step by step with intermediate values — do not show the final result alone.
  4. **Final conclusion**: an explicit answer for each sub-question (identified drug, computed value, whether the threshold was breached, reorder amount, etc.).
  
  ### 2. `.xlsx` — Calculation Results & Inventory Reconciliation
  Calculation results, inventory verification, and structured operation records. If the problem does not require modifying the inventory details, you may return the original attached `.xlsx` while retaining necessary calculations/annotations.
